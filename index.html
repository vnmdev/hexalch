<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23141419'/%3E%3Cg transform='translate(8,8) scale(0.84)' fill='none' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cdefs%3E%3ClinearGradient id='g' gradientUnits='userSpaceOnUse' x1='20' y1='6' x2='72' y2='96'%3E%3Cstop offset='0' stop-color='%23e86d4c'/%3E%3Cstop offset='1' stop-color='%238e2318'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg stroke='url(%23g)'%3E%3Ccircle cx='50' cy='50' r='42'/%3E%3Cpath d='M50 8 L86.4 71 L13.6 71 Z'/%3E%3Crect x='33' y='37' width='34' height='34'/%3E%3Ccircle cx='50' cy='54' r='17'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
  <title>The Great Work — Hex Alchemy</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --bg-gradient: radial-gradient(circle at center, #1a1a20 0%, #0a0a0c 100%);
      --panel: rgba(21, 21, 26, 0.85);
      --border: #2a2a35;
      --text: #d0d0d5;
      --accent: #e8be2a; /* Gold */
      --accent-glow: rgba(232, 190, 42, 0.3);
      --prima: #d8d8d8;
      --sulfur: #e8be2a;
      --mercury: #46c4ba;
      --salt: #bccacf;
      --quintessence: #ff5ce0;
      --green: #5ce05c;
      --red: #e0564c;
      --gold: #e8be2a;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    header {
      text-align: center;
      padding: 14px 20px;
      width: 100%;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(to bottom, rgba(26, 26, 32, 0.8), transparent);
    }
    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 4px;
      color: var(--accent);
      text-shadow: 0 0 15px var(--accent-glow);
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 14px;
      color: #777;
      font-style: italic;
      margin-top: 6px;
      letter-spacing: 1px;
    }
    .location-display {
      display: flex;
      justify-content: center;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 8px;
    }
    #loc-title { color: var(--accent); font-weight: bold; letter-spacing: 2px; }
    #loc-info { color: #999; font-size: 12px; font-style: italic; }

    main {
      display: grid;
      grid-template-columns: 300px 1fr 300px;
      gap: 20px;
      width: 100%;
      max-width: 1600px;
      padding: 16px;
      flex-grow: 1;
      min-height: 0;
      align-items: start;
    }

    /* Panels */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 100%;
      min-height: 0;
      backdrop-filter: blur(5px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .panel-header {
      padding: 12px;
      background: linear-gradient(to right, rgba(232, 190, 42, 0.15), transparent);
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      text-shadow: 0 0 5px var(--accent-glow);
    }
    .panel-content { padding: 15px; flex-grow: 1; overflow-y: auto; min-height: 0; }

    /* Ledger (Resources) */
    .resource-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.3);
      border-left: 2px solid transparent;
      transition: border-color 0.3s;
    }
    .resource-item:hover { border-left-color: var(--accent); }
    .icon { display: inline-block; flex: 0 0 auto; vertical-align: -0.1em; filter: drop-shadow(0 0 3px var(--glow, transparent)); }
    .icon svg { width: 100%; height: 100%; display: block; }
    .resource-item { gap: 8px; }
    .resource-val { margin-left: auto; }
    #opus-banner .opus-icon { width: 72px; height: 72px; margin-bottom: 16px; filter: drop-shadow(0 0 16px rgba(232, 109, 76, 0.55)); }
    .resource-name { font-size: 14px; opacity: 0.9; }
    .resource-val { font-family: 'Courier New', Courier, monospace; font-size: 17px; font-weight: bold; }

    /* Crucible (Board) */
    #crucible {
      display: flex;
      flex-direction: column;
    }
    .board-wrap {
      position: relative;
      width: 100%;
      background: #050505;
      padding: 10px;
      border-radius: 15px;
      border: 1px solid var(--border);
      margin: 10px 0;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.5);
      user-select: none;
      transition: box-shadow 0.4s, border-color 0.4s;
    }
    .board-wrap.success {
      border-color: var(--green);
      animation: success-glow 1.6s ease;
    }
    @keyframes success-glow {
      0%, 100% { box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.5); }
      50% { box-shadow: inset 0 0 90px rgba(92,224,92,0.35), 0 0 45px var(--green); }
    }
    #board {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 400px);
    }
    #win-banner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      background: rgba(5, 5, 5, 0.55);
      border-radius: 14px;
    }
    #win-banner.show { opacity: 1; }
    #win-banner .win-text {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 4px;
      color: var(--green);
      text-transform: uppercase;
      text-shadow: 0 0 22px var(--green);
      animation: win-pop 0.5s ease;
    }
    #win-banner .win-sub {
      margin-top: 10px;
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--accent);
    }
    @keyframes win-pop {
      0% { transform: scale(0.8); opacity: 0; }
      60% { transform: scale(1.06); }
      100% { transform: scale(1); opacity: 1; }
    }
    #opus-banner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s;
      background: rgba(5, 5, 8, 0.93);
      border-radius: 14px;
      z-index: 10;
    }
    #opus-banner.show { opacity: 1; pointer-events: auto; }
    #opus-banner .opus-text {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 5px;
      color: var(--gold);
      text-transform: uppercase;
      text-shadow: 0 0 26px var(--gold);
      animation: win-pop 0.6s ease;
    }
    #opus-banner .opus-sub {
      margin-top: 12px;
      font-size: 14px;
      letter-spacing: 1px;
      color: #cbb26a;
      font-style: italic;
    }
    #opus-continue {
      margin-top: 24px;
      border: 1px solid var(--gold);
      color: var(--gold);
      background: transparent;
      font-size: 13px;
    }
    #opus-continue:hover { background: var(--gold); color: #1a1408; }
    svg { display: block; height: auto; }

    .controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 10px;}
    button {
      background: #1a1a20;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    button:hover { background: var(--border); border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    button.primary:hover { background: #f5cf45; transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: 0.4; }
    .tech-btn.primary:not(:disabled), .transmute-btn:not(:disabled) { border-color: var(--accent); }
    .tech-btn.just-affordable, .transmute-btn.just-affordable { animation: affordFlash 1s ease-out; }
    @keyframes affordFlash {
      0% { box-shadow: 0 0 0 0 var(--accent-glow); }
      35% { box-shadow: 0 0 16px 5px var(--accent-glow); }
      100% { box-shadow: 0 0 0 0 rgba(232, 190, 42, 0); }
    }

    /* Alembic (Tech Tree / Transmutation) */
    .tech-item {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      transition: all 0.3s;
    }
    .tech-item.unlocked { border-color: var(--accent); background: rgba(232, 190, 42, 0.05); }
    .tech-item.locked { opacity: 0.5; filter: grayscale(0.8); }
    .tech-name { font-weight: bold; display: block; margin-bottom: 4px; font-size: 14px; color: var(--text); }
    .tech-desc { font-size: 12px; color: #888; display: block; margin-bottom: 8px; }
    .tech-cost { font-size: 11px; color: var(--accent); font-family: monospace; font-weight: bold; }
    .tech-btn { width: 100%; margin-top: 10px; padding: 6px; font-size: 12px; }

    .transmute-btn {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
    }
    .transmute-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }

    /* Status Messages */
    #status { margin-top: 10px; font-size: 14px; height: 20px; text-align: center; font-style: italic; }
    .works-count { margin-top: 6px; font-size: 11px; color: #777; letter-spacing: 0.04em; }
    .status-win { color: var(--green); text-shadow: 0 0 5px var(--green); }
    .status-err { color: var(--red); }
    .status-info { color: #888; }
    #recipe { margin-top: 6px; font-size: 12px; height: 16px; text-align: center; letter-spacing: .5px; color: #9a8f7a; font-family: 'Courier New', Courier, monospace; }

    /* SVG Styles */
    polygon { stroke: #000; stroke-width: 1.5; cursor: pointer; transition: fill .05s, stroke .04s; }
    polygon:hover { fill: #2f2f2f; }
    polygon.filled { fill: #3b6840; }
    polygon.empty { fill: #7a2f2f; }
    polygon.scope { stroke: var(--accent); stroke-width: 3; }
    polygon.bad { stroke: var(--red); stroke-width: 3; }
    text { pointer-events: none; font-weight: 600; fill: #d8cbb2; user-select: none;
           paint-order: stroke; stroke: #100d0a; stroke-width: 2px; stroke-linejoin: round;
           transition: opacity .08s, fill .08s; }
    text.done { opacity: 0.28; }
    text.over { fill: var(--red); }
    .mirror-marker { fill: #9d8ec7; opacity: 0.75; }
    .mirror-marker.proven { fill: var(--accent); opacity: 1; }
    .clue-badge { font-family: 'Courier New', Courier, monospace; }
    .clue-badge.need { fill: var(--accent); }
    .clue-badge.ok { fill: #6f9e6a; }
    .clue-badge.over { fill: var(--red); }
    .clue-progress { font-size: 13px; color: var(--accent); font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }
    polygon.forced {
      stroke: var(--accent);
      stroke-width: 2;
      stroke-dasharray: 4 3;
      filter: drop-shadow(0 0 5px var(--accent-glow));
      animation: forcedMarch 0.9s linear infinite, forcedPulse 1.1s ease-in-out infinite;
    }
    @keyframes forcedMarch { to { stroke-dashoffset: -14; } }
    @keyframes forcedPulse { 50% { stroke-width: 3.5px; } }
    .resource-rate { font-size: 11px; color: #7fa87f; font-family: 'Courier New', Courier, monospace; margin-left: 6px; }
    .hidden { display: none; }

    /* Accessibility: honour a reduced-motion setting — no marching
       outlines, no affordability flash, no banner pops. Forced outlines
       remain visible as static strokes. */
    @media (prefers-reduced-motion: reduce) {
      polygon.forced, .board-wrap.success, .tech-btn.just-affordable,
      .transmute-btn.just-affordable, #win-banner, #opus-banner { animation: none; }
    }
    /* The board SVG never overflows a narrow layout: the viewBox keeps the
       hex proportions while the width follows its column. */
    #board { max-width: 100%; height: auto; display: block; }

    @media (max-width: 1000px) {
      main { grid-template-columns: 1fr; }
    }
    .tool-btn {
      background: #1a1a20;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .tool-btn.on {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Clue guide (the puzzle language, as unlocked) */
    .clue-guide { margin-top: 16px; width: 100%; display: flex; flex-direction: column; gap: 3px; }
    .clue-line { display: flex; align-items: baseline; gap: 8px; font-size: 11px; color: #999; }
    .clue-glyph { width: 28px; text-align: center; color: var(--accent); font-size: 13px; flex: 0 0 auto; }

  </style>
</head>
<body>

  <header>
    <h1>THE GREAT WORK</h1>
    <div class="subtitle">Transmute the elements to achieve the Magnum Opus</div>
    <div class="location-display" aria-live="polite">
      <span id="loc-title"></span>
      <span id="loc-info"></span>
    </div>
  </header>

  <main>
    <!-- Ledger Panel -->
    <section id="ledger" class="panel">
      <div class="panel-header">The Ledger</div>
      <div class="panel-content" id="resource-list"></div>
    </section>

    <!-- Crucible Panel -->
    <section id="crucible" class="panel">
      <div class="panel-header">The Crucible</div>
      <div class="panel-content" style="display:flex; flex-direction:column; align-items:center;">
        <div id="status"></div>
        <div id="works-count" class="works-count"></div>
        <div id="recipe"></div>
        <div class="board-wrap">
          <svg id="board" preserveAspectRatio="xMidYMin meet"></svg>
          <div id="win-banner">
            <span class="win-text">Transmutation Complete</span>
            <span class="win-sub">New work begins&hellip;</span>
          </div>
          <div id="opus-banner">
            <span class="opus-icon icon" id="opus-icon"></span>
            <span class="opus-text">Magnum Opus Complete</span>
            <span class="opus-sub" id="opus-sub">The Philosopher&rsquo;s Stone is forged. The work endures.</span>
            <button id="opus-continue">Continue the Work</button>
          </div>
        </div>
        <div class="controls" style="margin-top:8px;">
          <span id="clue-progress" class="clue-progress" title="clues satisfied / total"></span>
          <span id="move-count" class="clue-progress" title="state changes made on this board">0 moves</span>
          <span id="solve-time" class="clue-progress" title="time on this board">0m 0s</span>
        </div>
        <div class="controls">
          <button id="new-board" title="Forge a fresh board — paint on an unsolved board is refunded · press n">New Puzzle</button>
          <button id="check-board" title="Check the board: wrong greens get flagged · press c">Check</button>
          <button id="reset-board" title="Clear the board — painted cells are refunded · press x">Reset</button>
          <button id="solve-board" title="See the solution — this board yields nothing">Reveal</button>
        </div>
        <div class="controls" style="margin-top:20px;">
          <label style="font-size:12px; color:#aaa; display:flex; align-items:center; gap:5px; cursor:pointer;">
            <input type="checkbox" id="speed-mode" checked title="Toggle fast mode · press f"> Fast Mode
          </label>
        </div>
        <div class="controls" id="tool-controls">
          <button id="tGreen" class="tool-btn on" type="button" title="Green paint · press 1">Green</button>
          <button id="tRed" class="tool-btn" type="button" title="Red paint · press 2">Red</button>
          <button id="tErase" class="tool-btn" type="button" title="Erase paint · press 3">Erase</button>
        </div>
        <div id="clue-guide" class="clue-guide"></div>
      </div>
    </section>

    <!-- Alembic Panel -->
    <section id="alembic" class="panel">
      <div class="panel-header">The Alembic</div>
      <div class="panel-content">
        <div id="upgrades-list"></div>
        <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
        <div id="transmute-list"></div>
        <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
        <div id="tech-tree-list"></div>
      </div>
    </section>
  </main>

<script>
  "use strict";

  const SVG_NS = "http://www.w3.org/2000/svg";
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  const CLUE = Object.freeze({
    SURROUND: "surround",
    HALO: "halo",
    SPEAR: "spear",
    FLOW: "flow",
    MIRROR: "mirror",
  });
  const SPEAR_GLYPHS = ["╲", "—", "╱"];
  const FLOW_GLYPHS = ["→", "↗", "↖", "←", "↙", "↘"];
  const MAX_RADIUS = 5;
  const CLUE_BY_RADIUS = [CLUE.SURROUND, CLUE.HALO, CLUE.SPEAR, CLUE.FLOW, CLUE.MIRROR];

  // Clue languages for the in-game guide (board tooltips use the same
  // wording); a guide row appears exactly when the form can appear.
  const CLUE_INFO = {
    surround: { glyph: "⬡", name: "Surround", blurb: "greens in this cell and its neighbours" },
    halo: { glyph: "○", name: "Halo", blurb: "green neighbours; excludes this cell" },
    spear: { glyph: "╲—╱", name: "Spear", blurb: "greens across this complete axis" },
    flow: { glyph: "→", name: "Flow", blurb: "greens ahead in the arrow's direction" },
    mirror: { glyph: "◇", name: "Mirror", blurb: "greens around the reflected cell across the centre" },
  };
  // Elements the crucible transmutes at each radius. The crucible caps at
  // radius five, where all four classical elements flow at once; further
  // progression comes from inscribing clues, not from a bigger board.
  const ELEMENTS_BY_RADIUS = {
    3: ["earth"],
    4: ["earth", "water"],
    5: ["earth", "water", "air", "fire"]
  };

  // Clue inscription: the post-expansion upgrade path. Each level re-etches
  // `step` stripped clues back onto the board (this one and all future ones),
  // making the deduction faster. Higher levels unlock new clue forms so the
  // late game gets varied rather than merely bigger.
  const INSCRIPTION = { step: 3, baseCost: 100, growth: 1.6 };
  const INSCRIPTION_KINDS = { flow: 3, mirror: 6 };

  // Glyph icons from the provided sprite pack (hex-alchemist-icons_4,
  // affinity/ — the coloured set; README reserves it for metals + Stone
  // tiers, which monochrome tinting cannot reproduce). Inlined so the game
  // stays a single file. Gradient ids are namespaced per icon (g-<name>) —
  // a bare id="g" would collide once many copies share one document, and
  // url(#g) would silently resolve to the FIRST gradient in the page.
  const ICON_SVGS = {
    alkahest: `<svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><g stroke="#e0479c" stroke-width="10.5"><path d="M22 24 L78 24 L50 80 Z"/> <line x1="30" y1="52" x2="70" y2="52"/> <line x1="30" y1="64" x2="70" y2="64"/></g><g stroke="#14100c" stroke-width="4.5"><path d="M22 24 L78 24 L50 80 Z"/> <line x1="30" y1="52" x2="70" y2="52"/> <line x1="30" y1="64" x2="70" y2="64"/></g></svg>`,
    earth: `<svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><g stroke="#6f7a3c"><path d="M18 22 L82 22 L50 78 Z"/> <line x1="27" y1="56" x2="73" y2="56"/></g></svg>`,
    water: `<svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><g stroke="#2f7d94"><path d="M18 22 L82 22 L50 78 Z"/></g></svg>`,
    air: `<svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><g stroke="#b8c4b4"><path d="M50 22 L82 78 L18 78 Z"/> <line x1="27" y1="46" x2="73" y2="46"/></g></svg>`,
    fire: `<svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><g stroke="#d4552a"><path d="M50 22 L82 78 L18 78 Z"/></g></svg>`,

      const ti = document.createElementNS(SVG_NS, "title");
      ti.textContent = clueTitle(clue);
      poly[c.idx].appendChild(ti);
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("x", c.drawX); t.setAttribute("y", c.drawY + 1);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("dominant-baseline", "central");
      t.setAttribute("font-size", curFont);
      t.textContent = clueLabel(clue);
      t.classList.toggle("mirror", clue.kind === CLUE.MIRROR);
      boardEl.appendChild(t);
      txt[c.idx] = t;
      if (clue.kind === CLUE.MIRROR) {
        for (const governed of clue.cells) mirrorGovernors[governed].push(c.idx);
      }
    }
    for (let i = 0; i < cells.length; i++) {
      if (mirrorGovernors[i].length === 0) continue;
      const c = cells[i], marker = document.createElementNS(SVG_NS, "text");
      marker.setAttribute("x", c.drawX + s * 0.30);
      marker.setAttribute("y", c.drawY - s * 0.48);
      marker.setAttribute("text-anchor", "middle");
      marker.setAttribute("dominant-baseline", "central");
      marker.setAttribute("font-size", Math.max(9, Math.round(curFont * 0.55)));
      marker.classList.add("mirror-marker");
      marker.textContent = "◇";
      boardEl.appendChild(marker);
      mirrorMarkers[i] = marker;
    }
    // Flow/spear/halo clues get a live badge: how many more greens their
    // scope still needs (green painted + badge = the clue's count).
    for (let i = 0; i < cells.length; i++) {
      const clue = clues[i];
      if (!clue || (clue.kind !== CLUE.FLOW && clue.kind !== CLUE.SPEAR && clue.kind !== CLUE.HALO)) continue;
      const c = cells[i], badge = document.createElementNS(SVG_NS, "text");
      badge.setAttribute("x", c.drawX - s * 0.30);
      badge.setAttribute("y", c.drawY - s * 0.48);
      badge.setAttribute("text-anchor", "middle");
      badge.setAttribute("dominant-baseline", "central");
      badge.setAttribute("font-size", Math.max(9, Math.round(curFont * 0.55)));
      badge.classList.add("clue-badge");
      badge.dataset.idx = i;
      boardEl.appendChild(badge);
      clueBadges[i] = badge;
    }
    renderCell();
  }

  function paintCell(i) {
    const p = poly[i];
    p.classList.toggle("filled", state[i] === 1);
    p.classList.toggle("empty", state[i] === 2);
    p.classList.remove("bad");
  }

  function greenCount(clue) {
    let count = 0;
    for (const j of clue.cells) if (state[j] === 1) count++;
    return count;
  }

  function clueSatisfied(clue) { return greenCount(clue) === clue.count; }
  function mirrorResolved(clue) { return gameState.settings.speedMode || clue.cells.every(j => state[j] !== 0); }

  function updateFades() {
    // Pass 1: proven-red cells. In fast mode every scope of a satisfied
    // clue is settled, so its still-uncolored cells are known non-green.
    // They keep state 0 (they were never painted) and fade via CSS only.
    const red = new Array(cells.length).fill(false);
    let sat = 0, total = 0;
    for (let i = 0; i < cells.length; i++) {
      const clue = clues[i];
      if (!clue) continue;
      total++;
      const g = greenCount(clue);
      const done = g === clue.count && (clue.kind !== CLUE.MIRROR || mirrorResolved(clue));
      if (done) sat++;
      txt[i].classList.toggle("done", done);
      txt[i].classList.toggle("over", g > clue.count);
      if (gameState.settings.speedMode && g === clue.count) {
        for (const j of clue.cells) if (state[j] !== 1) red[j] = true;
      }
    }
    clueProgressEl.textContent = `${sat}/${total}`;
    if (gameState.settings.speedMode) {
      for (let i = 0; i < cells.length; i++) poly[i].classList.toggle("empty", red[i] && state[i] !== 1);
    }
    // Pass 2: flow/spear/halo badges and forced-move highlights.
    // remaining = count - greens painted, so painted greens + the badge
    // number always equal the clue count. A scope cell is a live unknown
    // when it is uncolored AND not proven non-green (fast-mode fades still
    // hold state 0 and must not count). When remaining equals the live
    // unknowns, every one of them is forced green: outline them as the
    // next valid move. In particular, when only one tile of such a clue
    // is left, that tile is highlighted.
    const forced = new Array(cells.length).fill(false);
    const speed = gameState.settings.speedMode;
    for (let i = 0; i < cells.length; i++) {
      const clue = clues[i];
      if (!clue || (clue.kind !== CLUE.FLOW && clue.kind !== CLUE.SPEAR && clue.kind !== CLUE.HALO)) continue;
      const g = greenCount(clue);
      const remaining = clue.count - g;
      const badge = clueBadges[i];
      if (badge) {
        if (remaining < 0) { badge.textContent = "!"; badge.classList.remove("need", "ok"); badge.classList.add("over"); }
        else if (remaining === 0) { badge.textContent = "✓"; badge.classList.remove("need", "over"); badge.classList.add("ok"); }
        else { badge.textContent = String(remaining); badge.classList.remove("ok", "over"); badge.classList.add("need"); }
        badge.dataset.remaining = String(remaining);
      }
      if (remaining > 0) {
        let unk = 0;
        for (const j of clue.cells) if (state[j] === 0 && (!speed || !red[j])) unk++;
        if (unk === remaining) {
          for (const j of clue.cells) if (state[j] === 0 && (!speed || !red[j])) forced[j] = true;
        }
      }
    }
    for (let i = 0; i < cells.length; i++) poly[i].classList.toggle("forced", forced[i]);
    updateMirrorMarkers();
  }

  function updateMirrorMarkers() {
    for (let i = 0; i < mirrorMarkers.length; i++) {
      const marker = mirrorMarkers[i];
      if (!marker) continue;
      marker.classList.toggle("hidden", gameState.settings.speedMode);
      let provesWaste = false;
      if (!gameState.settings.speedMode && state[i] === 0) {
        provesWaste = mirrorGovernors[i].some(source => clueSatisfied(clues[source]));
      }
      marker.textContent = provesWaste ? "◆" : "◇";
      marker.classList.toggle("proven", provesWaste);
    }
  }

  function renderCell() { for (let i = 0; i < cells.length; i++) paintCell(i); updateFades(); }

  // ---------- Interaction ----------

  function showScope(i) {
    if (i === hoveredCell) return;
    for (const j of highlightedScope) poly[j].classList.remove("scope");
    highlightedScope = [];
    hoveredCell = i;
    if (i < 0 || !clues[i]) return;
    highlightedScope = clues[i].cells.slice();
    for (const j of highlightedScope) poly[j].classList.add("scope");
  }

  function firstValue(i, button) {
    if (button === 1) return 0;
    if (button === 2) return gameState.settings.speedMode ? 0 : (state[i] === 2 ? 0 : 2);
    if (tool === "erase") return 0;
    if (tool === "red" && !gameState.settings.speedMode) return state[i] === 2 ? 0 : 2;
    return state[i] === 1 ? 0 : 1;
  }

  // Green cells feed the crucible: one prima materia per cell.
  // Changing a fed cell back to empty refunds it.
  function setCell(i, value) {
    if (value === 1 && state[i] !== 1) {
      if (gameState.resources.prima_materia.amount < 1) {
        setStatus("Not enough prima materia to feed the crucible.", "err");
        return false;
      }
      gameState.resources.prima_materia.amount -= 1;
    } else if (state[i] === 1 && value !== 1) {
      gameState.resources.prima_materia.amount += 1;
    }
    if (state[i] !== value) {
      undoStack.push({ i, from: state[i], to: value });
      if (undoStack.length > 50) undoStack.shift();
      puzzleMoves++;
      renderMoves();
      state[i] = value;
      paintCell(i);
      updateFades();
    }
    updateDynamicUI();
    return true;
  }

  // Z takes back the last stroke: the cell returns to its previous state
  // and the feed is reversed exactly — undoing a paint refunds a prima,
  // undoing an erase re-feeds one. The re-feed honours the same guard as
  // painting: with no prima, the stroke stays in the history.
  function undoPaint() {
    if (gameState.currentPuzzle.solved) { setStatus("The board is complete.", "info"); return false; }
    const item = undoStack.pop();
    if (!item) { setStatus("Nothing to undo.", "info"); return false; }
    if (item.to === 1 && item.from !== 1) {
      gameState.resources.prima_materia.amount += 1;
    } else if (item.from === 1 && item.to !== 1) {
      if (gameState.resources.prima_materia.amount < 1) {
        undoStack.push(item);
        setStatus("Cannot undo — no prima to re-feed that cell.", "err");
        return false;
      }
      gameState.resources.prima_materia.amount -= 1;
    }
    puzzleMoves++;
    renderMoves();
    state[item.i] = item.from;
    paintCell(item.i);
    updateFades();
    updateDynamicUI();
    return true;
  }

  function applyPaint(i, button) {
    if (gameState.currentPuzzle.solved) return;
    if (dragApply === null) dragApply = firstValue(i, button);
    if (!setCell(i, dragApply)) {
      dragApply = null;
      dragging = false;
    }
  }

  boardEl.addEventListener("mousedown", e => {
    const t = e.target.closest("polygon"); if (!t) return;
    e.preventDefault(); dragging = true; dragApply = null;
    applyPaint(+t.dataset.idx, e.button);
  });
  boardEl.addEventListener("mouseover", e => {
    const t = e.target.closest("polygon");
    if (!t) { showScope(-1); return; }
    const i = +t.dataset.idx;
    showScope(i);
    if (dragging) applyPaint(i, 0);
  });
  boardEl.addEventListener("mouseleave", () => showScope(-1));
  window.addEventListener("mouseup", () => { if (dragging) { dragging = false; afterMove(); } });
  window.addEventListener("pagehide", saveProgress);
  boardEl.addEventListener("contextmenu", e => e.preventDefault());

  function setTool(t) {
    if (gameState.settings.speedMode && t === "red") t = "green";
    tool = t;
    document.getElementById("tGreen").classList.toggle("on", t === "green");
    document.getElementById("tRed").classList.toggle("on", t === "red");
    document.getElementById("tErase").classList.toggle("on", t === "erase");
    document.getElementById("tRed").disabled = gameState.settings.speedMode;
  }

  // ---------- Win / Progress ----------

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls ? `status-${cls}` : "";
  }

  function boardComplete() {
    for (let i = 0; i < cells.length; i++) {
      if (gameState.settings.speedMode) {
        if ((state[i] === 1 ? 1 : 0) !== solution[i]) return false;
      } else {
        const want = solution[i] === 1 ? 1 : 2;
        if (state[i] !== want) return false;
      }
    }
    return true;
  }

  function afterMove() { if (!gameState.currentPuzzle.solved && boardComplete()) reportWin(); }

  function reportWin() {
    if (gameState.currentPuzzle.solved) return;
    gameState.currentPuzzle.solved = true;
    gameState.works = (gameState.works || 0) + 1;
    // The fastest board is the record: shown in the works row, flagged on
    // the banner when beaten, and persisted with the save.
    const isNewBest = puzzleSeconds > 0 && (gameState.bestSeconds === 0 || puzzleSeconds < gameState.bestSeconds);
    if (isNewBest) gameState.bestSeconds = puzzleSeconds;

    // The pattern is complete: whatever prima was fed into the green cells
    // is released as the elements the current crucible knows how to make.
    const greens = solution.filter(v => v === 1).length;
    const per = solveYield(greens);
    const outputs = [];
    for (const id of ELEMENTS_BY_RADIUS[gameState.currentPuzzle.radius]) {
      addInventory(id, per);
      outputs.push({ id, text: `${per} ${gameState.elements[id].sym} ${gameState.elements[id].name.toLowerCase()}` });
    }
    winSubEl.innerHTML = `${outputs.map(o => `${iconHtml(o.id, 14)}${o.text}`).join("  ")}  ·  ${greens} prima fed · ${puzzleMoves} moves · ${fmtTime(puzzleSeconds)}${isNewBest ? " · new best!" : ""}`;
    setStatus(`Transmutation complete: +${outputs.map(o => o.text).join(" +")}`, "win");

    updateUI();
    saveProgress();
    celebrateWin();
  }

  function celebrateWin() {
    winBannerEl.classList.add("show");
    boardWrapEl.classList.add("success");
    scheduleNextPuzzle();
  }

  function scheduleNextPuzzle() {
    if (nextPuzzleTimer) clearTimeout(nextPuzzleTimer);
    nextPuzzleTimer = setTimeout(() => {
      nextPuzzleTimer = null;
      startPuzzle();
    }, 1600);
  }

  // ---------- Game Operations ----------

  function inventoryEntry(id) {
    return gameState.resources[id] || gameState.metals[id] || gameState.elements[id] || null;
  }

  function addInventory(id, amount) {
    const entry = inventoryEntry(id);
    if (entry) entry.amount += amount;
  }

  function canAfford(cost) {
    return Object.entries(cost).every(([id, amount]) => (inventoryEntry(id)?.amount || 0) >= amount);
  }

  function spend(cost) {
    for (const [id, amount] of Object.entries(cost)) inventoryEntry(id).amount -= amount;
  }

  function formatCost(cost) {
    return Object.entries(cost)
      .map(([id, amount]) => `${amount} ${id.replaceAll("_", " ")}`)
      .join(" · ");
  }

  // ---------- Passive Generators ----------

  // The alchemist's own hands always gather a little prima; the machines
  // below are amplifications of that labor. This base rate also removes
  // the level-0 soft-lock (a solve can spend your entire stash).
  const BASE_GATHER = 0.5;

  // Offline progress: generators keep working while the tab is closed.
  // The credit is capped, and only applied when the absence is long
  // enough to be a real absence (a refresh is not "away").
  const OFFLINE_CAP = 8 * 3600; // max seconds of idle time credited
  const OFFLINE_MIN = 60;       // absences shorter than this earn nothing

  // Applies passive income. Called by the in-browser loop and driven
  // directly by the pacing harness.
  function tick(seconds) {
    if (!gameState.currentPuzzle.solved) puzzleSeconds += seconds;
    totalSeconds += seconds;
    addInventory("prima_materia", BASE_GATHER * seconds);
    for (const id of Object.keys(GENERATORS)) {
      const rate = generatorRate(id);
      if (rate > 0) addInventory(GENERATORS[id].produces, rate * seconds);
    }
  }

  function buyGenerator(id) {
    const gen = GENERATORS[id];
    if (!gen) return;
    if (gameState.upgrades.board_size.radius < gen.minRadius) {
      setStatus(`${gen.name} unlocks at crucible radius ${gen.minRadius}.`, "err");
      return;
    }
    const cost = generatorCost(id);
    if (gameState.resources.prima_materia.amount < cost) {
      setStatus("Not enough Prima Materia.", "err");
      return;
    }
    gameState.resources.prima_materia.amount -= cost;
    gameState.generators[id] = (gameState.generators[id] || 0) + 1;
    setStatus(`${gen.name} level ${gameState.generators[id]} — ${generatorRate(id).toFixed(2)}/s.`, "win");
    updateUI();
    saveProgress();
  }


  function startPuzzle() {
    if (nextPuzzleTimer) { clearTimeout(nextPuzzleTimer); nextPuzzleTimer = null; }
    winBannerEl.classList.remove("show");
    boardWrapEl.classList.remove("success");
    const wasSolved = gameState.currentPuzzle.solved;
    gameState.currentPuzzle.solved = false;
    const p = gameState.currentPuzzle;
    const insLevel = gameState.upgrades.inscription.level;
    const kinds = clueKinds(p.radius, insLevel);

    // After the Stone, the work deepens: every two completed works make the
    // generator try more times to thin the board (harder), capped at +10.
    const attempts = 5 + (gameState.techTree.philosophers_stone ? Math.min(10, Math.floor((gameState.works || 0) / 2)) : 0);
    p.attempts = attempts;
    generate(p.radius, p.density, p.attempts, kinds, insLevel * INSCRIPTION.step);
    const fed = wasSolved ? 0 : state.filter(v => v === 1).length;
    state = cells.map(() => 0);
    undoStack.length = 0;
    if (fed > 0) gameState.resources.prima_materia.amount += fed;
    puzzleMoves = 0; renderMoves(); puzzleSeconds = 0; renderTime();
    buildBoard();

    const greens = solution.filter(v => v === 1).length;
    const per = solveYield(greens);
    const etch = per - transmuteYield(greens);
    const symIcons = ELEMENTS_BY_RADIUS[p.radius].map(id => iconHtml(id, 13, gameState.elements[id].name)).join(" ");
    recipeEl.innerHTML = `feeds ${greens} prima  →  ${per} × ${symIcons}${etch ? `  (etching +${etch})` : ""}`;

    if (!gameState.tutored) {
      gameState.tutored = true;
      setStatus("Paint a tile green to feed it. Match every clue's number, then Check. Keys: 1/2/3 tools · N new · C check · X reset · Z undo · F fast mode.", "info");
    } else {
      setStatus("New puzzle forged — match every clue's number, then Check.", "info");
    }
    updateUI();
  }

  // Restore the board that was in progress at the last save: the solution,
  // clues and paint are serialized as-is, so no regeneration is needed.
  function restorePuzzle() {
    const w = gameState.wip;
    gameState.wip = null;
    const p = gameState.currentPuzzle;
    buildTopology(p.radius);
    solution = w.solution.slice();
    state = w.state.slice();
    undoStack.length = 0;
    clues = w.clues.map(c => (c ? { count: c.count, kind: c.kind, axis: c.axis, cells: c.cells.slice() } : null));
    p.removedFull = (w.removedFull || []).map(rf => ({ idx: rf.idx, clue: rf.clue }));
    p.removedTotal = w.removedTotal || 0;
    p.inscribed = w.inscribed || 0;
    p.solved = !!w.solved;
    puzzleMoves = Math.max(0, Math.floor(Number(w.moves) || 0)); renderMoves(); puzzleSeconds = 0; renderTime();
    buildBoard();
    for (let i = 0; i < cells.length; i++) if (state[i] !== 0) paintCell(i);
    const greens = solution.filter(v => v === 1).length;
    const per = solveYield(greens);
    const etch = per - transmuteYield(greens);
    const symIcons = ELEMENTS_BY_RADIUS[p.radius].map(id => iconHtml(id, 13, gameState.elements[id].name)).join(" ");
    recipeEl.innerHTML = `feeds ${greens} prima  →  ${per} × ${symIcons}${etch ? `  (etching +${etch})` : ""}`;
    if (p.solved) { winBannerEl.classList.remove("show"); boardWrapEl.classList.remove("success"); }
    setStatus("The crucible remembers where you left off.", "info");
    updateFades();
    updateUI();
  }

  function upgradeBoard() {
    if (gameState.upgrades.board_size.radius >= MAX_RADIUS) {
      setStatus("The crucible has reached its final form.", "info");
      return;
    }
    const cost = gameState.upgrades.board_size.cost;
    if (gameState.resources.prima_materia.amount >= cost) {
      gameState.resources.prima_materia.amount -= cost;
      gameState.upgrades.board_size.radius += 1;
      gameState.upgrades.board_size.cost = Math.floor(cost * 1.6);
      gameState.currentPuzzle.radius = gameState.upgrades.board_size.radius;
      startPuzzle();
      saveProgress();
    } else {
      setStatus("Not enough Prima Materia.", "err");
    }
  }

  function inscriptionCost() {
    return Math.floor(INSCRIPTION.baseCost * Math.pow(INSCRIPTION.growth, gameState.upgrades.inscription.level));
  }

  function buyInscription() {
    const ins = gameState.upgrades.inscription;
    const p = gameState.currentPuzzle;
    const cost = inscriptionCost();
    if (gameState.resources.prima_materia.amount < cost) {
      setStatus("Not enough Prima Materia.", "err");
      return;
    }
    gameState.resources.prima_materia.amount -= cost;
    ins.level += 1;
    const want = Math.min(ins.level * INSCRIPTION.step, p.removedTotal || 0);
    for (let k = p.inscribed || 0; k < want; k++) {
      const rf = p.removedFull[k];
      clues[rf.idx] = rf.clue;
    }
    p.inscribed = want;
    buildBoard();
    let note = "";
    if (ins.level === INSCRIPTION_KINDS.flow) note = " Flow clues join future boards.";
    else if (ins.level === INSCRIPTION_KINDS.mirror) note = " Mirror clues join future boards.";
    setStatus(`Clues inscribed: ${p.inscribed} of ${p.removedTotal || 0} on this board.${note}`, "win");
    updateUI();
    saveProgress();
  }

  function buyTech(techId) {
    const tech = getTechById(techId);
    if (!tech) return;
    if (gameState.techTree[techId]) return;
    
    // Check requirement
    const reqs = tech.req;
    for(const r of reqs) if(!gameState.techTree[r]) {
      setStatus(`Requires ${getTechById(r).name}`, "err");
      return;
    }

    if (!canAfford(tech.cost)) {
      setStatus(`Requires ${formatCost(tech.cost)}.`, "err");
      return;
    }
    spend(tech.cost);
    gameState.techTree[techId] = true;
    setStatus(`${tech.name} achieved!`, "win");
    updateUI();
    saveProgress();
    if (techId === "philosophers_stone") celebrateMagnumOpus();
  }

  // The Great Work is done: a persistent gold overlay marks the completion
  // and offers to keep playing in endless mode.
  function celebrateMagnumOpus() {
    const opusIconEl = document.getElementById("opus-icon");
    if (opusIconEl && !opusIconEl.innerHTML) {
      opusIconEl.style["--glow"] = ICON_GLOW["philosophers-stone-iv"];
      opusIconEl.innerHTML = ICON_SVGS["philosophers-stone-iv"];
    }
    const bestNote = gameState.bestSeconds > 0 ? ` · best ${fmtTime(gameState.bestSeconds)}` : "";
    document.getElementById("opus-sub").textContent = `The Philosopher's Stone is forged. ${fmtTime(totalSeconds)} in the work, ${gameState.works} boards completed${bestNote}. The work endures.`;
    opusBannerEl.classList.add("show");
    boardWrapEl.classList.add("success");
  }

  function getTechById(id) {
    return TECHS.find(t => t.id === id);
  }

  // ---------- Transmutation Implementation ----------

  function transmute(type, id) {
    const recipe = type === 'metal' ? METAL_RECIPES[id] : ELEMENT_RECIPES[id];
    if (!recipe) return;

    if (!canAfford(recipe.cost)) {
      setStatus(`Requires ${formatCost(recipe.cost)}.`, "err");
      return;
    }
    spend(recipe.cost);

    if (type === 'metal') gameState.metals[id].amount++;
    else gameState.elements[id].amount++;

    setStatus(`Transmuted ${id}!`, "win");
    updateUI();
    saveProgress();
  }

  // ---------- UI Management ----------

  // Live registries for the per-second refresh: the ledger amount spans and
  // the buy buttons. The lists themselves are rebuilt only when structure
  // changes (updateUI).
  const amountEls = [];
  const buyButtons = [];

  function updateUI() {
    amountEls.length = 0;
    buyButtons.length = 0;
    renderResources();
    renderUpgrades();
    renderTechTree();
    renderTransmutation();
    renderClueGuide();
    renderWorks();
    updateLocationUI();
  }

  // Per-second refresh: update ledger amounts and buy-button affordability
  // in place. A full re-render every tick would destroy button hover/focus
  // and needlessly discard the inline glyph SVGs.
  function updateDynamicUI() {
    for (const a of amountEls) {
      const data = gameState.resources[a.id] || gameState.metals[a.id] || gameState.elements[a.id];
      if (data) a.el.textContent = String(Math.floor(data.amount));
    }
    for (const b of buyButtons) {
      const afford = canAfford(b.cost);
      if (afford && b.el.disabled) b.el.classList.add("just-affordable");
      else if (!afford && !b.el.disabled) b.el.classList.remove("just-affordable");
      b.el.disabled = !afford;
    }
    // The New Puzzle tooltip states exactly what a click would refund.
    if (gameState.currentPuzzle.solved) {
      newBoardBtn.title = "Forge a fresh board · press n";
    } else {
      const fed = state.filter(v => v === 1).length;
      newBoardBtn.title = fed > 0
        ? `Forge a fresh board — ${fed} prima refunded · press n`
        : "Forge a fresh board — paint on an unsolved board is refunded · press n";
    }
    renderTime();
  }

  function registerButton(el, cost) {
    el.disabled = !canAfford(cost);
    buyButtons.push({ el, cost });
  }

  function renderClueGuide() {
    guideEl.innerHTML = "";
    const kinds = clueKinds(gameState.upgrades.board_size.radius, gameState.upgrades.inscription.level);
    for (const kind of kinds) {
      const info = CLUE_INFO[kind];
      const line = document.createElement("div");
      line.className = "clue-line";
      const glyph = document.createElement("span");
      glyph.className = "clue-glyph";
      glyph.textContent = info.glyph;
      const text = document.createElement("span");
      const onBoard = clues.filter(c => c && c.kind === kind).length;
      text.textContent = `${info.name}: ${info.blurb}` + (onBoard > 0 ? ` — ${onBoard} on this board` : "");
      line.appendChild(glyph);
      line.appendChild(text);
      guideEl.appendChild(line);
    }
  }

  function renderWorks() {
    worksEl.textContent = gameState.bestSeconds > 0
      ? `Works completed: ${gameState.works} · best ${fmtTime(gameState.bestSeconds)}`
      : `Works completed: ${gameState.works}`;
  }

  function checkAndSetLocation() {
    const insLevel = gameState.upgrades.inscription.level;
    for (const [id, loc] of Object.entries(LOCATIONS)) {
      if (gameState.upgrades.board_size.radius >= loc.minRadius && insLevel >= (loc.minInscription || 0)) gameState.currentLocationId = id;
    }
  }

  function updateLocationUI() {
    const prev = gameState.currentLocationId;
    checkAndSetLocation();
    const loc = LOCATIONS[gameState.currentLocationId];
    const titleEl = document.getElementById("loc-title");
    const infoEl = document.getElementById("loc-info");

    titleEl.textContent = loc.name;
    infoEl.textContent = loc.desc;
    document.documentElement.style.setProperty("--bg", loc.bg);
    document.documentElement.style.setProperty("--accent", loc.accent);
    document.body.style.backgroundColor = loc.bg;
    if (gameState.currentLocationId !== prev) {
      setStatus(`The crucible carries you to ${loc.name}.`, "win");
    }
  }

  function resourceRow(id, data, sym, showRate) {
    const div = document.createElement("div");
    div.className = "resource-item";
    const icon = document.createElement("span");
    icon.innerHTML = iconHtml(id, 16, data.name);
    const name = document.createElement("span");
    name.className = "resource-name";
    if (data.color) name.style.color = data.color;
    name.textContent = sym ? `${sym} ${data.name}` : data.name;
    const val = document.createElement("span");
    val.className = "resource-val";
    const amt = document.createElement("span");
    amt.className = "res-amount";
    amt.textContent = String(Math.floor(data.amount));
    val.appendChild(amt);
    if (showRate) {
      const rate = incomeRate(id);
      if (rate > 0) {
        const r = document.createElement("span");
        r.className = "resource-rate";
        r.textContent = `+${rate.toFixed(2)}/s`;
        val.appendChild(r);
      }
    }
    div.appendChild(icon);
    div.appendChild(name);
    div.appendChild(val);
    amountEls.push({ el: amt, id });
    return div;
  }

  function renderResources() {
    resListEl.innerHTML = "";
    // Render basic resources
    for (const [id, data] of Object.entries(gameState.resources)) {
      if (data.amount > 0 || id === "prima_materia") resListEl.appendChild(resourceRow(id, data, null, true));
    }
    // Render metals
    const metalHeader = document.createElement("div");
    metalHeader.className = "panel-header";
    metalHeader.style.marginTop = "20px";
    metalHeader.style.padding = "5px 0";
    metalHeader.textContent = "Metals";
    resListEl.appendChild(metalHeader);
    for (const [id, data] of Object.entries(gameState.metals)) {
      if (data.amount > 0) resListEl.appendChild(resourceRow(id, data, data.sym, false));
    }
    // Render elements
    const elemHeader = document.createElement("div");
    elemHeader.className = "panel-header";
    elemHeader.style.marginTop = "20px";
    elemHeader.style.padding = "5px 0";
    elemHeader.textContent = "Elements";
    resListEl.appendChild(elemHeader);
    for (const [id, data] of Object.entries(gameState.elements)) {
      if (data.amount > 0) resListEl.appendChild(resourceRow(id, data, data.sym, true));
    }
  }

  function renderUpgrades() {
    upgradeListEl.innerHTML = "";
    const radius = gameState.upgrades.board_size.radius;
    const insLevel = gameState.upgrades.inscription.level;
    const atMaxRadius = radius >= MAX_RADIUS;

    // Board expansion (the crucible's two size increases).
    const boardCost = gameState.upgrades.board_size.cost;
    const bDiv = document.createElement("div");
    bDiv.className = "tech-item";
    bDiv.innerHTML = `
      <span class="tech-name">Expand Crucible</span>
      <span class="tech-desc">${atMaxRadius ? "The crucible has reached its final form." : `Increase radius to ${radius + 1}`}</span>
      ${atMaxRadius ? "" : `<span class="tech-cost">${boardCost} Prima Materia</span>`}
      ${atMaxRadius ? "" : `<button class="tech-btn primary" id="btn-upgrade-board">Upgrade</button>`}
    `;
    upgradeListEl.appendChild(bDiv);
    if (!atMaxRadius) {
      const btn = document.getElementById("btn-upgrade-board");
      btn.onclick = upgradeBoard;
      registerButton(btn, { prima_materia: boardCost });
    }

    // Clue inscription (the long upgrade path: faster deductions).
    const p = gameState.currentPuzzle;
    const inscribedNow = p.inscribed || 0;
    const insCost = inscriptionCost();
    const nextKind = insLevel < INSCRIPTION_KINDS.flow
      ? `Flow clues join at level ${INSCRIPTION_KINDS.flow}`
      : insLevel < INSCRIPTION_KINDS.mirror
        ? `Mirror clues join at level ${INSCRIPTION_KINDS.mirror}`
        : "All clue forms etched";
    const iDiv = document.createElement("div");
    iDiv.className = "tech-item";
    iDiv.innerHTML = `
      <span class="tech-name">Inscribe Clues · Level ${insLevel}</span>
      <span class="tech-desc">Re-etch ${INSCRIPTION.step} stripped clues onto the board (this one and all future ones) — a faster deduction. ${inscribedNow}/${p.removedTotal || 0} etched here. ${nextKind}.</span>
      <span class="tech-cost">${insCost} Prima Materia</span>
      <button class="tech-btn primary" id="btn-inscribe">Inscribe</button>
    `;
    upgradeListEl.appendChild(iDiv);
    {
      const btn = document.getElementById("btn-inscribe");
      btn.onclick = buyInscription;
      registerButton(btn, { prima_materia: insCost });
    }

    // Generators (the passive income options, all visible at once).
    const gHeader = document.createElement("div");
    gHeader.className = "panel-header";
    gHeader.style.marginTop = "10px";
    gHeader.style.padding = "5px 0";
    gHeader.textContent = "Generators";
    upgradeListEl.appendChild(gHeader);
    for (const [id, gen] of Object.entries(GENERATORS)) {
      const level = gameState.generators[id] || 0;
      const locked = radius < gen.minRadius;
      const div = document.createElement("div");
      div.className = "tech-item" + (locked ? " locked" : "");
      const rate = generatorRate(id);
      const cost = generatorCost(id);
      div.innerHTML = `
        <span class="tech-name">${iconHtml(gen.produces, 14, resName(gen.produces))}${gen.name}${level > 0 ? ` · Lv ${level}` : ""}</span>
        <span class="tech-desc">${locked ? `Unlocks at crucible radius ${gen.minRadius}.` : `Produces ${rate.toFixed(2)} ${gen.produces.replaceAll("_", " ")}/s`}</span>
        ${locked ? "" : `<span class="tech-cost">${cost} Prima Materia</span>`}
        ${locked ? "" : `<button class="tech-btn primary" id="btn-gen-${id}">${level > 0 ? "Expand" : "Build"}</button>`}
      `;
      upgradeListEl.appendChild(div);
      if (!locked) {
        const btn = document.getElementById(`btn-gen-${id}`);
        btn.onclick = () => buyGenerator(id);
        registerButton(btn, { prima_materia: cost });
      }
    }

    const kinds = clueKinds(radius, insLevel);
    const nextLocation = Object.values(LOCATIONS).find(l => !(radius >= l.minRadius && insLevel >= (l.minInscription || 0)));
    const progress = document.createElement("div");
    progress.className = "tech-item unlocked";
    progress.innerHTML = `
      <span class="tech-name">Crucible radius ${radius} · Inscription ${insLevel}</span>
      <span class="tech-desc">Clues: ${kinds.join(", ")}</span>
      <span class="tech-desc">${nextLocation ? `Next location: ${nextLocation.name} (${radius < nextLocation.minRadius ? `radius ${nextLocation.minRadius}` : `inscription ${nextLocation.minInscription}`})` : "All locations unlocked"}</span>
    `;
    upgradeListEl.appendChild(progress);
  }

  function renderTechTree() {
    techListEl.innerHTML = "";
    TECHS.forEach(t => {
      const isUnlocked = gameState.techTree[t.id];
      const isAvailable = t.req.every(r => gameState.techTree[r]);
      
      const div = document.createElement("div");
      div.className = "tech-item" + (isUnlocked ? " unlocked" : (isAvailable ? "" : " locked"));
      
      const costStr = formatCost(t.cost);

      div.innerHTML = `
        <span class="tech-name">${iconHtml(t.id, 16, t.name)}${t.name} ${isUnlocked ? "✓" : ""}</span>
        <span class="tech-desc">${t.desc}</span>
        ${!isUnlocked && isAvailable ? `<span class="tech-cost">${costStr}</span>` : ""}
        ${!isUnlocked && !isAvailable ? `<span class="tech-cost">Requires ${t.req.filter(r => !gameState.techTree[r]).map(id => getTechById(id).name).join(" and ")}</span>` : ""}
        ${!isUnlocked && isAvailable ? `<button class="tech-btn primary" id="btn-tech-${t.id}">Perform</button>` : ""}
      `;
      techListEl.appendChild(div);
      
      if (!isUnlocked && isAvailable) {
        const btn = document.getElementById(`btn-tech-${t.id}`);
        btn.onclick = () => buyTech(t.id);
        registerButton(btn, t.cost);
      }
    });
  }

  function renderTransmutation() {
    transmuteListEl.innerHTML = "";
    
    // Metals
    const mHeader = document.createElement("div");
    mHeader.className = "panel-header";
    mHeader.style.marginTop = "10px";
    mHeader.style.padding = "5px 0";
    mHeader.textContent = "Transmute Metals";
    transmuteListEl.appendChild(mHeader);

    for (const [id, data] of Object.entries(gameState.metals)) {
      const recipe = METAL_RECIPES[id];
      const div = document.createElement("div");
      div.className = "tech-item";
      const costStr = formatCost(recipe.cost);
      div.innerHTML = `
        <span class="tech-name">${iconHtml(id, 16, data.name)}${data.sym} ${data.name}</span>
        <span class="tech-cost">${costStr}</span>
        <button class="transmute-btn" id="transmute-m-${id}">Transmute</button>
      `;
      transmuteListEl.appendChild(div);
      {
        const btn = document.getElementById(`transmute-m-${id}`);
        btn.onclick = () => transmute('metal', id);
        registerButton(btn, recipe.cost);
      }
    }

    // Quintessence: the classical elements are the crucible's own output;
    // only the fifth essence is still distilled by hand here.
    const qHeader = document.createElement("div");
    qHeader.className = "panel-header";
    qHeader.style.marginTop = "10px";
    qHeader.style.padding = "5px 0";
    qHeader.textContent = "Distill Quintessence";
    transmuteListEl.appendChild(qHeader);

    {
      const id = "quintessence";
      const data = gameState.elements[id];
      const recipe = ELEMENT_RECIPES[id];
      const div = document.createElement("div");
      div.className = "tech-item";
      const costStr = formatCost(recipe.cost);
      div.innerHTML = `
        <span class="tech-name">${iconHtml("quintessence", 16, data.name)}${data.sym} ${data.name}</span>
        <span class="tech-desc">Unite earth, water, air and fire.</span>
        <span class="tech-cost">${costStr}</span>
        <button class="transmute-btn" id="transmute-e-${id}">Distill</button>
      `;
      transmuteListEl.appendChild(div);
      {
        const btn = document.getElementById(`transmute-e-${id}`);
        btn.onclick = () => transmute('element', id);
        registerButton(btn, recipe.cost);
      }
    }
  }

  // ---------- Persistence ----------

  const SAVE_KEY = "greatwork_v4";

  function saveProgress() {
    // The in-progress board is saved with the economy: solution, paint and
    // clues are plain data, so a refresh restores the work exactly.
    const wip = {
      radius: R,
      solution: solution.slice(),
      state: state.slice(),
      clues: clues.map(c => (c ? { count: c.count, kind: c.kind, axis: c.axis, cells: c.cells.slice() } : null)),
      removedFull: (gameState.currentPuzzle.removedFull || []).map(rf => ({ idx: rf.idx, clue: rf.clue })),
      removedTotal: gameState.currentPuzzle.removedTotal || 0,
      inscribed: gameState.currentPuzzle.inscribed || 0,
      solved: gameState.currentPuzzle.solved,
      moves: puzzleMoves
    };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...gameState, wip, savedAt: Date.now() })); } catch(e) {}
  }

  function mergeInventoryMap(defaultMap, savedMap = {}, legacyMap = {}) {
    const merged = {};
    for (const [id, defaultEntry] of Object.entries(defaultMap)) {
      const saved = savedMap?.[id] ?? legacyMap?.[id];
      const savedAmount = typeof saved === "number" ? saved : Number(saved?.amount);
      merged[id] = {
        ...defaultEntry,
        ...(saved && typeof saved === "object" ? saved : {}),
        amount: Number.isFinite(savedAmount) ? Math.max(0, savedAmount) : defaultEntry.amount
      };
    }
    return merged;
  }

  function loadProgress() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (!d || typeof d !== "object") return;

      const defaults = gameState;
      const savedRadius = Number(d.upgrades?.board_size?.radius ?? d.currentPuzzle?.radius);
      const radius = Number.isFinite(savedRadius)
        ? Math.min(MAX_RADIUS, Math.max(3, Math.floor(savedRadius)))
        : defaults.upgrades.board_size.radius;
      const savedCost = Number(d.upgrades?.board_size?.cost);
      const insLevel = Math.max(0, Math.floor(Number(d.upgrades?.inscription?.level) || 0));
      const techTree = Object.fromEntries(TECHS.map(tech => [tech.id, Boolean(d.techTree?.[tech.id])]));
      if (d.techTree?.magnum_opus) techTree.philosophers_stone = true;

      const cellCount = 1 + 3 * radius * (radius + 1);
      const wip = (d.wip && Number.isInteger(d.wip.radius) && d.wip.radius === radius
        && Array.isArray(d.wip.solution) && d.wip.solution.length === cellCount
        && Array.isArray(d.wip.state) && d.wip.state.length === cellCount
        && Array.isArray(d.wip.clues) && d.wip.clues.length === cellCount)
        ? d.wip : null;

      gameState = {
        ...defaults,
        resources: mergeInventoryMap(defaults.resources, d.resources),
        metals: mergeInventoryMap(defaults.metals, d.metals),
        elements: mergeInventoryMap(defaults.elements, d.elements, d.resources),
        generators: { ...defaults.generators, ...(d.generators || {}) },
        upgrades: {
          board_size: {
            radius,
            cost: Number.isFinite(savedCost) && savedCost > 0 ? savedCost : defaults.upgrades.board_size.cost
          },
          inscription: { level: insLevel }
        },
        techTree,
        settings: { ...defaults.settings, ...(d.settings || {}) },
        currentPuzzle: { radius, density: 0.4, attempts: 5, solved: false },
        currentLocationId: d.currentLocationId || defaults.currentLocationId,
        works: Math.max(0, Math.floor(Number(d.works) || 0)),
        bestSeconds: Math.max(0, Math.floor(Number(d.bestSeconds) || 0)),
        tutored: !!d.tutored,
        wip
      };
      applyOfflineProgress(d.savedAt);
    } catch(e) { console.error(e); }
  }

  // Generators keep working while the work is closed: on return, credit the
  // capped elapsed time and hold the announcement until after the board
  // restores, so it is the first thing the player sees.
  function applyOfflineProgress(savedAt) {
    const dt = Number.isFinite(savedAt) ? Math.min(OFFLINE_CAP, (Date.now() - savedAt) / 1000) : 0;
    if (dt < OFFLINE_MIN) return;
    const gains = [];
    for (const [gid, gen] of Object.entries(GENERATORS)) {
      const rate = generatorRate(gid);
      if (rate <= 0) continue;
      const gain = rate * dt;
      const pool = gen.produces === "prima_materia" ? gameState.resources : gameState.elements;
      pool[gen.produces].amount += gain;
      gains.push(`${gain >= 100 ? Math.floor(gain) : gain.toFixed(1)} ${gen.produces.replaceAll("_", " ")}`);
    }
    const away = dt >= 3600 ? `${Math.floor(dt / 3600)} h ${Math.floor(dt % 3600 / 60)} m` : `${Math.floor(dt / 60)} m ${Math.floor(dt % 60)} s`;
    if (gains.length) offlineMessage = `While you were away (${away}), the generators kept working: +${gains.join(", ")}.`;
  }

  // ---------- Initialization ----------

  document.getElementById("new-board").onclick = startPuzzle;

  function checkBoard() {
    if(boardComplete()) { if(!gameState.currentPuzzle.solved) reportWin(); return; }
    let bad=0;
    for(let i=0;i<cells.length;i++){
      poly[i].classList.remove("bad");
      if(state[i]===1 && solution[i]===0){ poly[i].classList.add("bad"); bad++; }
    }
    setStatus(bad? `${bad} mistakes detected.` : "No mistakes so far.", bad?"err":"info");
  }
  document.getElementById("check-board").onclick = checkBoard;

  function resetBoard() {
    if(gameState.currentPuzzle.solved) return;
    const fed = state.filter(v => v === 1).length;
    state = cells.map(()=>0);
    undoStack.length = 0;
    if (fed > 0) gameState.resources.prima_materia.amount += fed;
    renderCell(); renderResources(); setStatus(fed > 0 ? `Board cleared — ${fed} prima refunded.` : "Board cleared.", "info");
  }
  document.getElementById("reset-board").onclick = resetBoard;

  // Keyboard shortcuts for the board controls (desktop convenience).
  window.addEventListener("keydown", e => {
    if (e.target && e.target.tagName && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const k = (e.key || "").toLowerCase();
    if (k === "1") setTool("green");
    else if (k === "2") setTool("red");
    else if (k === "3") setTool("erase");
    else if (k === "n") startPuzzle();
    else if (k === "c") checkBoard();
    else if (k === "x") resetBoard();
    else if (k === "z") undoPaint();
    else if (k === "f") { const cb = document.getElementById("speed-mode"); cb.checked = !cb.checked; cb.onchange({ target: cb }); }
  });
  document.getElementById("solve-board").onclick = () => {
    for(let i=0;i<cells.length;i++) state[i]= solution[i]===1 ? 1 : (gameState.settings.speedMode ? 0 : 2);
    undoStack.length = 0;
    gameState.currentPuzzle.solved = true; renderCell();
    setStatus("Solution revealed — no yield for this board. Forge a new puzzle to continue.", "info");
  };
  document.getElementById("opus-continue").onclick = () => {
    opusBannerEl.classList.remove("show");
    boardWrapEl.classList.remove("success");
    setStatus("The work endures. Transmute on.", "info");
  };
  document.getElementById("speed-mode").onchange = (e) => {
    gameState.settings.speedMode = e.target.checked;
    if(gameState.settings.speedMode){ 
      for(let i=0;i<cells.length;i++) if(state[i]===2) state[i]=0;
      undoStack.length = 0;
      setTool("green"); 
    }
    renderCell();
    setStatus(gameState.settings.speedMode ? "Fast Mode: leftovers auto-fill red." : "Manual Mode: mark reds yourself.", "info");
    setTool(tool);
    saveProgress();
  };

  document.getElementById("tGreen").onclick = ()=> setTool("green");
  document.getElementById("tRed").onclick   = ()=> setTool("red");
  document.getElementById("tErase").onclick = ()=> setTool("erase");

  loadProgress();
  document.getElementById("speed-mode").checked = gameState.settings.speedMode;
  setTool("green");
  if (gameState.wip) restorePuzzle();
  else startPuzzle();
  if (offlineMessage) { setStatus(offlineMessage, "info"); offlineMessage = null; }
  setInterval(() => { tick(1); updateDynamicUI(); }, 1000);

 </script>
