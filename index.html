<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Work — Hex Alchemy</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --bg-gradient: radial-gradient(circle at center, #1a1a20 0%, #0a0a0c 100%);
      --panel: rgba(21, 21, 26, 0.85);
      --border: #2a2a35;
      --text: #d0d0d5;
      --accent: #e8be2a; /* Gold */
      --accent-glow: rgba(232, 190, 42, 0.3);
      --prima: #d8d8d8;
      --sulfur: #e8be2a;
      --mercury: #46c4ba;
      --salt: #bccacf;
      --quintessence: #ff5ce0;
      --green: #5ce05c;
      --red: #e0564c;
      --gold: #e8be2a;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    header {
      text-align: center;
      padding: 14px 20px;
      width: 100%;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(to bottom, rgba(26, 26, 32, 0.8), transparent);
    }
    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 4px;
      color: var(--accent);
      text-shadow: 0 0 15px var(--accent-glow);
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 14px;
      color: #777;
      font-style: italic;
      margin-top: 6px;
      letter-spacing: 1px;
    }
    .location-display {
      display: flex;
      justify-content: center;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 8px;
    }
    #loc-title { color: var(--accent); font-weight: bold; letter-spacing: 2px; }
    #loc-info { color: #999; font-size: 12px; font-style: italic; }

    main {
      display: grid;
      grid-template-columns: 300px 1fr 300px;
      gap: 20px;
      width: 100%;
      max-width: 1600px;
      padding: 16px;
      flex-grow: 1;
      min-height: 0;
      align-items: start;
    }

    /* Panels */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 100%;
      min-height: 0;
      backdrop-filter: blur(5px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .panel-header {
      padding: 12px;
      background: linear-gradient(to right, rgba(232, 190, 42, 0.15), transparent);
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      text-shadow: 0 0 5px var(--accent-glow);
    }
    .panel-content { padding: 15px; flex-grow: 1; overflow-y: auto; min-height: 0; }

    /* Ledger (Resources) */
    .resource-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.3);
      border-left: 2px solid transparent;
      transition: border-color 0.3s;
    }
    .resource-item:hover { border-left-color: var(--accent); }
    .resource-name { font-size: 14px; opacity: 0.9; }
    .resource-val { font-family: 'Courier New', Courier, monospace; font-size: 17px; font-weight: bold; }

    /* Crucible (Board) */
    #crucible {
      display: flex;
      flex-direction: column;
    }
    .board-wrap {
      position: relative;
      width: 100%;
      background: #050505;
      padding: 10px;
      border-radius: 15px;
      border: 1px solid var(--border);
      margin: 10px 0;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.5);
      user-select: none;
      transition: box-shadow 0.4s, border-color 0.4s;
    }
    .board-wrap.success {
      border-color: var(--green);
      animation: success-glow 1.6s ease;
    }
    @keyframes success-glow {
      0%, 100% { box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.5); }
      50% { box-shadow: inset 0 0 90px rgba(92,224,92,0.35), 0 0 45px var(--green); }
    }
    #board {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 400px);
    }
    #win-banner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      background: rgba(5, 5, 5, 0.55);
      border-radius: 14px;
    }
    #win-banner.show { opacity: 1; }
    #win-banner .win-text {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 4px;
      color: var(--green);
      text-transform: uppercase;
      text-shadow: 0 0 22px var(--green);
      animation: win-pop 0.5s ease;
    }
    #win-banner .win-sub {
      margin-top: 10px;
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--accent);
    }
    @keyframes win-pop {
      0% { transform: scale(0.8); opacity: 0; }
      60% { transform: scale(1.06); }
      100% { transform: scale(1); opacity: 1; }
    }
    #opus-banner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s;
      background: rgba(5, 5, 8, 0.93);
      border-radius: 14px;
      z-index: 10;
    }
    #opus-banner.show { opacity: 1; pointer-events: auto; }
    #opus-banner .opus-text {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 5px;
      color: var(--gold);
      text-transform: uppercase;
      text-shadow: 0 0 26px var(--gold);
      animation: win-pop 0.6s ease;
    }
    #opus-banner .opus-sub {
      margin-top: 12px;
      font-size: 14px;
      letter-spacing: 1px;
      color: #cbb26a;
      font-style: italic;
    }
    #opus-continue {
      margin-top: 24px;
      border: 1px solid var(--gold);
      color: var(--gold);
      background: transparent;
      font-size: 13px;
    }
    #opus-continue:hover { background: var(--gold); color: #1a1408; }
    svg { display: block; height: auto; }

    .controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 10px;}
    button {
      background: #1a1a20;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    button:hover { background: var(--border); border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    button.primary:hover { background: #f5cf45; transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: 0.4; }

    /* Alembic (Tech Tree / Transmutation) */
    .tech-item {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      transition: all 0.3s;
    }
    .tech-item.unlocked { border-color: var(--accent); background: rgba(232, 190, 42, 0.05); }
    .tech-item.locked { opacity: 0.5; filter: grayscale(0.8); }
    .tech-name { font-weight: bold; display: block; margin-bottom: 4px; font-size: 14px; color: var(--text); }
    .tech-desc { font-size: 12px; color: #888; display: block; margin-bottom: 8px; }
    .tech-cost { font-size: 11px; color: var(--accent); font-family: monospace; font-weight: bold; }
    .tech-btn { width: 100%; margin-top: 10px; padding: 6px; font-size: 12px; }

    .transmute-btn {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
    }
    .transmute-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }

    /* Status Messages */
    #status { margin-top: 10px; font-size: 14px; height: 20px; text-align: center; font-style: italic; }
    .status-win { color: var(--green); text-shadow: 0 0 5px var(--green); }
    .status-err { color: var(--red); }
    .status-info { color: #888; }
    #recipe { margin-top: 6px; font-size: 12px; height: 16px; text-align: center; letter-spacing: .5px; color: #9a8f7a; font-family: 'Courier New', Courier, monospace; }

    /* SVG Styles */
    polygon { stroke: #000; stroke-width: 1.5; cursor: pointer; transition: fill .05s, stroke .04s; }
    polygon:hover { fill: #2f2f2f; }
    polygon.filled { fill: #3b6840; }
    polygon.empty { fill: #7a2f2f; }
    polygon.scope { stroke: var(--accent); stroke-width: 3; }
    polygon.bad { stroke: var(--red); stroke-width: 3; }
    text { pointer-events: none; font-weight: 600; fill: #d8cbb2; user-select: none;
           paint-order: stroke; stroke: #100d0a; stroke-width: 2px; stroke-linejoin: round;
           transition: opacity .08s, fill .08s; }
    text.done { opacity: 0.28; }
    text.over { fill: var(--red); }
    .mirror-marker { fill: #9d8ec7; opacity: 0.75; }
    .mirror-marker.proven { fill: var(--accent); opacity: 1; }
    .clue-badge { font-family: 'Courier New', Courier, monospace; }
    .clue-badge.need { fill: var(--accent); }
    .clue-badge.ok { fill: #6f9e6a; }
    .clue-badge.over { fill: var(--red); }
    polygon.forced { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
    .resource-rate { font-size: 11px; color: #7fa87f; font-family: 'Courier New', Courier, monospace; margin-left: 6px; }
    .hidden { display: none; }

    @media (max-width: 1000px) {
      main { grid-template-columns: 1fr; }
    }
    .tool-btn {
      background: #1a1a20;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .tool-btn.on {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

  </style>
</head>
<body>

  <header>
    <h1>THE GREAT WORK</h1>
    <div class="subtitle">Transmute the elements to achieve the Magnum Opus</div>
    <div class="location-display" aria-live="polite">
      <span id="loc-title"></span>
      <span id="loc-info"></span>
    </div>
  </header>

  <main>
    <!-- Ledger Panel -->
    <section id="ledger" class="panel">
      <div class="panel-header">The Ledger</div>
      <div class="panel-content" id="resource-list"></div>
    </section>

    <!-- Crucible Panel -->
    <section id="crucible" class="panel">
      <div class="panel-header">The Crucible</div>
      <div class="panel-content" style="display:flex; flex-direction:column; align-items:center;">
        <div id="status"></div>
        <div id="recipe"></div>
        <div class="board-wrap">
          <svg id="board" preserveAspectRatio="xMidYMin meet"></svg>
          <div id="win-banner">
            <span class="win-text">Transmutation Complete</span>
            <span class="win-sub">New work begins&hellip;</span>
          </div>
          <div id="opus-banner">
            <span class="opus-text">Magnum Opus Complete</span>
            <span class="opus-sub">The Philosopher&rsquo;s Stone is forged. The work endures.</span>
            <button id="opus-continue">Continue the Work</button>
          </div>
        </div>
        <div class="controls">
          <button id="new-board">New Puzzle</button>
          <button id="check-board">Check</button>
          <button id="reset-board">Reset</button>
          <button id="solve-board">Reveal</button>
        </div>
        <div class="controls" style="margin-top:20px;">
          <label style="font-size:12px; color:#aaa; display:flex; align-items:center; gap:5px; cursor:pointer;">
            <input type="checkbox" id="speed-mode" checked> Fast Mode
          </label>
        </div>
        <div class="controls" id="tool-controls">
          <button id="tGreen" class="tool-btn on" type="button">Green</button>
          <button id="tRed" class="tool-btn" type="button">Red</button>
          <button id="tErase" class="tool-btn" type="button">Erase</button>
        </div>
      </div>
    </section>

    <!-- Alembic Panel -->
    <section id="alembic" class="panel">
      <div class="panel-header">The Alembic</div>
      <div class="panel-content">
        <div id="upgrades-list"></div>
        <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
        <div id="transmute-list"></div>
        <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
        <div id="tech-tree-list"></div>
      </div>
    </section>
  </main>

<script>
  "use strict";

  const SVG_NS = "http://www.w3.org/2000/svg";
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  const CLUE = Object.freeze({
    SURROUND: "surround",
    HALO: "halo",
    SPEAR: "spear",
    FLOW: "flow",
    MIRROR: "mirror",
  });
  const SPEAR_GLYPHS = ["╲", "—", "╱"];
  const FLOW_GLYPHS = ["→", "↗", "↖", "←", "↙", "↘"];
  const MAX_RADIUS = 5;
  const CLUE_BY_RADIUS = [CLUE.SURROUND, CLUE.HALO, CLUE.SPEAR, CLUE.FLOW, CLUE.MIRROR];
  // Elements the crucible transmutes at each radius. The crucible caps at
  // radius five, where all four classical elements flow at once; further
  // progression comes from inscribing clues, not from a bigger board.
  const ELEMENTS_BY_RADIUS = {
    3: ["earth"],
    4: ["earth", "water"],
    5: ["earth", "water", "air", "fire"]
  };

  // Clue inscription: the post-expansion upgrade path. Each level re-etches
  // `step` stripped clues back onto the board (this one and all future ones),
  // making the deduction faster. Higher levels unlock new clue forms so the
  // late game gets varied rather than merely bigger.
  const INSCRIPTION = { step: 3, baseCost: 100, growth: 1.6 };
  const INSCRIPTION_KINDS = { flow: 3, mirror: 6 };

  // Yield per unlocked element for a solve with `greens` green cells.
  function transmuteYield(greens) {
    return Math.max(1, Math.round(greens / 10));
  }

  const LOCATIONS = {
    leaden_chamber: {
      name: "The Leaden Chamber",
      desc: "A heavy, dark room where matter is first gathered.",
      bg: "#0e0e0e",
      accent: "#8a8f9c",
      minRadius: 3
    },
    martial_forge: {
      name: "The Martial Forge",
      desc: "Heat and friction prepare the metals for change.",
      bg: "#1a0a0a",
      accent: "#c07a63",
      minRadius: 4
    },
    lunar_sanctum: {
      name: "The Lunar Sanctum",
      desc: "A place of quiet reflection and silver light.",
      bg: "#0a1015",
      accent: "#e6eaef",
      minRadius: 5
    },
    solar_temple: {
      name: "The Solar Temple",
      desc: "Where the light of the sun turns base metal to gold.",
      bg: "#1a150a",
      accent: "#e8be2a",
      minRadius: 5,
      minInscription: 3
    },
    aetheric_vault: {
      name: "The Aetheric Vault",
      desc: "Beyond the physical realm, the essence awaits.",
      bg: "#0a0515",
      accent: "#ff5ce0",
      minRadius: 5,
      minInscription: 6
    }
  };

  const METAL_RECIPES = {
    lead: { cost: { prima_materia: 20 }, sym: "Pb" },
    iron: { cost: { prima_materia: 100, earth: 3 }, sym: "Fe" },
    copper: { cost: { prima_materia: 250, iron: 2, fire: 2 }, sym: "Cu" },
    silver: { cost: { prima_materia: 600, copper: 3, water: 5 }, sym: "Ag" },
    gold: { cost: { prima_materia: 1500, silver: 3, quintessence: 1 }, sym: "Au" }
  };

  // The four classical elements come out of the crucible itself; only the
  // fifth essence is still distilled by hand.
  const ELEMENT_RECIPES = {
    quintessence: { cost: { earth: 10, water: 10, air: 10, fire: 10 }, sym: "Ω" }
  };

  const TECHS = [
    { id: "nigredo", name: "Nigredo", desc: "Blacken and dissolve the base matter.", cost: { lead: 5, earth: 10 }, req: [] },
    { id: "albedo", name: "Albedo", desc: "Wash the work clean in lunar white.", cost: { silver: 2, water: 20 }, req: ["nigredo"] },
    { id: "citrinitas", name: "Citrinitas", desc: "Awaken the solar spirit within it.", cost: { gold: 2, air: 25 }, req: ["albedo"] },
    { id: "rubedo", name: "Rubedo", desc: "Unite the opposites in the red stage.", cost: { copper: 5, fire: 30 }, req: ["citrinitas"] },
    { id: "philosophers_stone", name: "The Philosopher's Stone", desc: "Complete and stabilize the Magnum Opus.", cost: { gold: 5, quintessence: 10 }, req: ["rubedo"] }
  ];

  // Passive generators: the workhorses that gather resources while you transmute.
  // Costs are paid in prima materia; rates scale 1.5x per level.
  const GENERATORS = {
    extractor:    { name: "Prima Extractor", produces: "prima_materia", baseRate: 1,    baseCost: 15,   minRadius: 3 },
    earth_well:   { name: "Earth Well",      produces: "earth",         baseRate: 0.05, baseCost: 300,  minRadius: 4 },
    water_well:   { name: "Water Well",      produces: "water",         baseRate: 0.05, baseCost: 800,  minRadius: 4 },
    air_vent:     { name: "Air Vent",        produces: "air",           baseRate: 0.05, baseCost: 1500, minRadius: 5 },
    fire_furnace: { name: "Fire Furnace",    produces: "fire",          baseRate: 0.05, baseCost: 2500, minRadius: 5 }
  };

  function generatorRate(id) {
    const level = gameState.generators[id] || 0;
    return level === 0 ? 0 : GENERATORS[id].baseRate * Math.pow(1.5, level - 1);
  }

  function generatorCost(id) {
    return Math.floor(GENERATORS[id].baseCost * Math.pow(1.8, gameState.generators[id] || 0));
  }


  // Passive income per second for a resource (base gathering for prima,
  // generators for the elements).
  function incomeRate(id) {
    let rate = 0;
    for (const [gid, gen] of Object.entries(GENERATORS)) {
      if (gen.produces === id) rate += generatorRate(gid);
    }
    if (id === "prima_materia") rate += BASE_GATHER;
    return rate;
  }
  let gameState = {
    resources: {
      prima_materia: { name: "Prima Materia", amount: 20, color: "#d8d8d8" }
    },
    metals: {
      lead: { name: "Lead", amount: 0, sym: "Pb" },
      iron: { name: "Iron", amount: 0, sym: "Fe" },
      copper: { name: "Copper", amount: 0, sym: "Cu" },
      silver: { name: "Silver", amount: 0, sym: "Ag" },
      gold: { name: "Gold", amount: 0, sym: "Au" }
    },
    elements: {
      earth: { name: "Earth", amount: 0, sym: "🜃" },
      water: { name: "Water", amount: 0, sym: "🜄" },
      air: { name: "Air", amount: 0, sym: "🜁" },
      fire: { name: "Fire", amount: 0, sym: "🜂" },
      quintessence: { name: "Quintessence", amount: 0, sym: "Ω" }
    },
    generators: {
      extractor: 0,
      earth_well: 0,
      water_well: 0,
      air_vent: 0,
      fire_furnace: 0
    },
    upgrades: {
      board_size: { radius: 3, cost: 50 },
      inscription: { level: 0 }
    },
    techTree: {},
    settings: { speedMode: true },
    currentPuzzle: { radius: 3, density: 0.4, attempts: 5, solved: false },
    currentLocationId: "leaden_chamber"
  };

  let cells = [], idxOf = new Map(), block = [], solution = [], clues = [];
  let state = [], poly = [], txt = [], mirrorMarkers = [], mirrorGovernors = [], clueBadges = [];
  let nextPuzzleTimer = null;
  let highlightedScope = [], hoveredCell = -1, dragging = false, dragApply = null, tool = "green";
  let R, W, H, ox, oy, boardEl, boardWrapEl, winBannerEl, winSubEl, opusBannerEl, recipeEl, resListEl, upgradeListEl, techListEl, transmuteListEl, statusEl;

  boardEl = document.getElementById("board");
  boardWrapEl = document.querySelector(".board-wrap");
  winBannerEl = document.getElementById("win-banner");
  opusBannerEl = document.getElementById("opus-banner");
  resListEl = document.getElementById("resource-list");
  winSubEl = document.querySelector("#win-banner .win-sub");
  recipeEl = document.getElementById("recipe");
  upgradeListEl = document.getElementById("upgrades-list");
  techListEl = document.getElementById("tech-tree-list");
  transmuteListEl = document.getElementById("transmute-list");
  statusEl = document.getElementById("status");

  // ---------- Core Engine ----------

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function buildTopology(radius) {
    R = radius; cells = []; idxOf = new Map();
    for (let q = -R; q <= R; q++) for (let r = -R; r <= R; r++) {
      if (Math.abs(q + r) > R) continue;
      idxOf.set(q + "," + r, cells.length);
      cells.push({ q, r, idx: cells.length });
    }
    block = cells.map(c => [c.idx]);
    for (const c of cells) for (const [dq, dr] of DIRS) {
      const k = idxOf.get((c.q + dq) + "," + (c.r + dr));
      if (k !== undefined) block[c.idx].push(k);
    }
  }

  function deduce(cluesArr, known) {
    let prog = true;
    while (prog) {
      prog = false;
      for (let i = 0; i < cells.length; i++) {
        const clue = cluesArr[i];
        if (!clue) continue;
        let kf = 0; const unk = [];
        for (const j of clue.cells) { if (known[j] === 1) kf++; else if (known[j] === -1) unk.push(j); }
        const need = clue.count - kf;
        if (need < 0 || need > unk.length) return "contradiction";
        if (unk.length === 0) continue;
        if (need === 0) { for (const j of unk) known[j] = 0; prog = true; }
        else if (need === unk.length) { for (const j of unk) known[j] = 1; prog = true; }
      }
    }
    for (let i = 0; i < cells.length; i++) if (known[i] === -1) return "partial";
    return "solved";
  }

  function trySolve(cluesArr) {
    const known = new Array(cells.length).fill(-1);
    return { res: deduce(cluesArr, known), known };
  }

  function randomAxis(i, kind) {
    if (kind !== CLUE.FLOW) return Math.floor(Math.random() * 3);
    const c = cells[i], valid = [];
    for (let axis = 0; axis < DIRS.length; axis++) {
      const [dq, dr] = DIRS[axis];
      if (idxOf.has((c.q + dq) + "," + (c.r + dr))) valid.push(axis);
    }
    return valid[Math.floor(Math.random() * valid.length)];
  }

  function clueScope(i, kind, axis) {
    const c = cells[i];
    if (kind === CLUE.HALO) return block[i].filter(j => j !== i);
    if (kind === CLUE.SPEAR) {
      return cells.filter(other => {
        if (axis === 0) return other.q === c.q;
        if (axis === 1) return other.r === c.r;
        return other.q + other.r === c.q + c.r;
      }).map(other => other.idx);
    }
    if (kind === CLUE.FLOW) {
      const result = [], [dq, dr] = DIRS[axis];
      let q = c.q + dq, r = c.r + dr;
      while (idxOf.has(q + "," + r)) {
        result.push(idxOf.get(q + "," + r));
        q += dq; r += dr;
      }
      return result;
    }
    if (kind === CLUE.MIRROR) return block[idxOf.get((-c.q) + "," + (-c.r))].slice();
    return block[i].slice();
  }

  function buildCompleteClues(sol, kinds) {
    const result = new Array(cells.length);
    const order = shuffle(cells.map(c => c.idx));
    const offset = Math.floor(Math.random() * kinds.length);
    order.forEach((i, n) => {
      const kind = kinds[(n + offset) % kinds.length];
      const axis = randomAxis(i, kind);
      const scope = clueScope(i, kind, axis);
      let count = 0;
      for (const j of scope) count += sol[j];
      result[i] = { count, kind, axis, cells: scope };
    });
    return result;
  }

  function stripClues(full) {
    const working = full.slice();
    const order = shuffle(cells.map(c => c.idx));
    const protectedKinds = new Set(), protectedCells = new Set();
    for (const i of order) {
      const kind = working[i].kind;
      if (!protectedKinds.has(kind)) {
        protectedKinds.add(kind);
        protectedCells.add(i);
      }
    }
    const removed = [];
    for (const i of order) {
      if (protectedCells.has(i)) continue;
      const saved = working[i];
      working[i] = null;
      if (trySolve(working).res !== "solved") working[i] = saved;
      else removed.push(i);
    }
    return { working, removed };
  }

  function buildOne(density, kinds) {
    while (true) {
      const sol = cells.map(() => Math.random() < density ? 1 : 0);
      if (sol.every(x => x === 0) || sol.every(x => x === 1)) continue;
      const full = buildCompleteClues(sol, kinds);
      if (trySolve(full).res !== "solved") continue;
      const stripped = stripClues(full);
      return { sol, working: stripped.working, full, removed: stripped.removed };
    }
  }

  // Clue forms available at a given radius and inscription level: the first
  // three scale with the crucible, the last two are etched into existence.
  function clueKinds(radius, insLevel) {
    const base = Math.min(3, Math.max(1, radius - 2));
    const kinds = CLUE_BY_RADIUS.slice(0, base);
    if (insLevel >= INSCRIPTION_KINDS.flow) kinds.push(CLUE.FLOW);
    if (insLevel >= INSCRIPTION_KINDS.mirror) kinds.push(CLUE.MIRROR);
    return kinds;
  }

  function generate(radius, density, attempts, kinds, inscribedWanted) {
    buildTopology(radius);
    let best = null, bestCount = Infinity;
    for (let a = 0; a < (attempts || 1); a++) {
      const cand = buildOne(density, kinds);
      const cnt = cand.working.reduce((s, x) => s + (x !== null ? 1 : 0), 0);
      if (cnt < bestCount) { bestCount = cnt; best = cand; }
    }
    solution = best.sol;
    clues = best.working;
    // Inscription: re-etch the first stripped clues. Adding clues back to a
    // uniquely solvable board never breaks unique solvability.
    const p = gameState.currentPuzzle;
    p.removedFull = best.removed.map(idx => ({ idx, clue: best.full[idx] }));
    p.removedTotal = best.removed.length;
    p.inscribed = Math.max(0, Math.min(inscribedWanted || 0, p.removedTotal));
    for (let k = 0; k < p.inscribed; k++) {
      const rf = p.removedFull[k];
      clues[rf.idx] = rf.clue;
    }
  }

  function hexPoints(cx, cy, s) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const ang = Math.PI / 180 * (60 * i - 30);
      pts.push((cx + s * Math.cos(ang)).toFixed(2) + "," + (cy + s * Math.sin(ang)).toFixed(2));
    }
    return pts.join(" ");
  }

  function clueLabel(clue) {
    if (clue.kind === CLUE.HALO) return `○${clue.count}`;
    if (clue.kind === CLUE.SPEAR) return `${SPEAR_GLYPHS[clue.axis]}${clue.count}`;
    if (clue.kind === CLUE.FLOW) return `${FLOW_GLYPHS[clue.axis]}${clue.count}`;
    if (clue.kind === CLUE.MIRROR) return `◇${clue.count}`;
    return String(clue.count);
  }

  function clueTitle(clue) {
    const label = clueLabel(clue);
    if (clue.kind === CLUE.HALO) return `${label}: green neighbours; excludes this cell`;
    if (clue.kind === CLUE.SPEAR) return `${label}: greens across this complete axis`;
    if (clue.kind === CLUE.FLOW) return `${label}: greens ahead in the arrow's direction`;
    if (clue.kind === CLUE.MIRROR) return `${label}: greens around the reflected cell across the centre`;
    return `${label}: greens in this cell and its neighbours`;
  }

  function buildBoard() {
    const s = R <= 2 ? 50 : R === 3 ? 42 : R === 4 ? 36 : R === 5 ? 31 : R === 6 ? 27
        : R === 7 ? 24 : R === 8 ? 22 : R === 9 ? 20 : 18;
    const curFont = Math.max(12, (s * 0.82) | 0);
    const W = Math.sqrt(3) * s, H = 1.5 * s;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const c of cells) {
      c.cx = W * (c.q + c.r / 2); c.cy = H * c.r;
      minX = Math.min(minX, c.cx); maxX = Math.max(maxX, c.cx);
      minY = Math.min(minY, c.cy); maxY = Math.max(maxY, c.cy);
    }
    const pad = s + 4, ox = pad - minX, oy = pad - minY;
    const svgW = (maxX - minX) + 2 * pad, svgH = (maxY - minY) + 2 * pad;
    boardEl.setAttribute("viewBox", `0 0 ${svgW.toFixed(1)} ${svgH.toFixed(1)}`);
    boardEl.innerHTML = ""; poly = []; txt = []; mirrorMarkers = []; clueBadges = [];
    mirrorGovernors = cells.map(() => []);
    highlightedScope = []; hoveredCell = -1;

    for (const c of cells) {
      const cx = c.cx + ox, cy = c.cy + oy;
      c.drawX = cx; c.drawY = cy;
      const p = document.createElementNS(SVG_NS, "polygon");
      p.setAttribute("points", hexPoints(cx, cy, s - 1));
      p.setAttribute("fill", "#232323");
      p.dataset.idx = c.idx;
      boardEl.appendChild(p);
      poly[c.idx] = p;
    }
    for (const c of cells) {
      const clue = clues[c.idx];
      if (!clue) continue;
      const ti = document.createElementNS(SVG_NS, "title");
      ti.textContent = clueTitle(clue);
      poly[c.idx].appendChild(ti);
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("x", c.drawX); t.setAttribute("y", c.drawY + 1);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("dominant-baseline", "central");
      t.setAttribute("font-size", curFont);
      t.textContent = clueLabel(clue);
      t.classList.toggle("mirror", clue.kind === CLUE.MIRROR);
      boardEl.appendChild(t);
      txt[c.idx] = t;
      if (clue.kind === CLUE.MIRROR) {
        for (const governed of clue.cells) mirrorGovernors[governed].push(c.idx);
      }
    }
    for (let i = 0; i < cells.length; i++) {
      if (mirrorGovernors[i].length === 0) continue;
      const c = cells[i], marker = document.createElementNS(SVG_NS, "text");
      marker.setAttribute("x", c.drawX + s * 0.30);
      marker.setAttribute("y", c.drawY - s * 0.48);
      marker.setAttribute("text-anchor", "middle");
      marker.setAttribute("dominant-baseline", "central");
      marker.setAttribute("font-size", Math.max(9, Math.round(curFont * 0.55)));
      marker.classList.add("mirror-marker");
      marker.textContent = "◇";
      boardEl.appendChild(marker);
      mirrorMarkers[i] = marker;
    }
    // Flow/spear clues get a live badge: how many more greens their scope
    // still needs (green painted + badge = the clue's count).
    for (let i = 0; i < cells.length; i++) {
      const clue = clues[i];
      if (!clue || (clue.kind !== CLUE.FLOW && clue.kind !== CLUE.SPEAR)) continue;
      const c = cells[i], badge = document.createElementNS(SVG_NS, "text");
      badge.setAttribute("x", c.drawX - s * 0.30);
      badge.setAttribute("y", c.drawY - s * 0.48);
      badge.setAttribute("text-anchor", "middle");
      badge.setAttribute("dominant-baseline", "central");
      badge.setAttribute("font-size", Math.max(9, Math.round(curFont * 0.55)));
      badge.classList.add("clue-badge");
      badge.dataset.idx = i;
      boardEl.appendChild(badge);
      clueBadges[i] = badge;
    }
    renderCell();
  }

  function paintCell(i) {
    const p = poly[i];
    p.classList.toggle("filled", state[i] === 1);
    p.classList.toggle("empty", state[i] === 2);
    p.classList.remove("bad");
  }

  function greenCount(clue) {
    let count = 0;
    for (const j of clue.cells) if (state[j] === 1) count++;
    return count;
  }

  function clueSatisfied(clue) { return greenCount(clue) === clue.count; }
  function mirrorResolved(clue) { return gameState.settings.speedMode || clue.cells.every(j => state[j] !== 0); }

  function updateFades() {
    const red = new Array(cells.length).fill(false);
    const forced = new Array(cells.length).fill(false);
    for (let i = 0; i < cells.length; i++) {
      const clue = clues[i];
      if (!clue) continue;
      const g = greenCount(clue);
      const done = g === clue.count && (clue.kind !== CLUE.MIRROR || mirrorResolved(clue));
      txt[i].classList.toggle("done", done);
      txt[i].classList.toggle("over", g > clue.count);
      if (gameState.settings.speedMode && g === clue.count) {
        for (const j of clue.cells) if (state[j] !== 1) red[j] = true;
      }
      // Flow/spear badges: remaining = count - greens painted. When the
      // remaining need equals the unknowns in scope, every one of them is
      // forced green: highlight them as the next valid move.
      if (clue.kind === CLUE.FLOW || clue.kind === CLUE.SPEAR) {
        const remaining = clue.count - g;
        const badge = clueBadges[i];
        if (badge) {
          if (remaining < 0) { badge.textContent = "!"; badge.classList.remove("need", "ok"); badge.classList.add("over"); }
          else if (remaining === 0) { badge.textContent = "✓"; badge.classList.remove("need", "over"); badge.classList.add("ok"); }
          else { badge.textContent = String(remaining); badge.classList.remove("ok", "over"); badge.classList.add("need"); }
          badge.dataset.remaining = String(remaining);
        }
        if (remaining > 0) {
          const unk = clue.cells.filter(j => state[j] === 0).length;
          if (remaining === unk) for (const j of clue.cells) if (state[j] === 0) forced[j] = true;
        }
      }
    }
    if (gameState.settings.speedMode) {
      for (let i = 0; i < cells.length; i++) poly[i].classList.toggle("empty", red[i] && state[i] !== 1);
    }
    for (let i = 0; i < cells.length; i++) poly[i].classList.toggle("forced", forced[i]);
    updateMirrorMarkers();
  }

  function updateMirrorMarkers() {
    for (let i = 0; i < mirrorMarkers.length; i++) {
      const marker = mirrorMarkers[i];
      if (!marker) continue;
      marker.classList.toggle("hidden", gameState.settings.speedMode);
      let provesWaste = false;
      if (!gameState.settings.speedMode && state[i] === 0) {
        provesWaste = mirrorGovernors[i].some(source => clueSatisfied(clues[source]));
      }
      marker.textContent = provesWaste ? "◆" : "◇";
      marker.classList.toggle("proven", provesWaste);
    }
  }

  function renderCell() { for (let i = 0; i < cells.length; i++) paintCell(i); updateFades(); }

  // ---------- Interaction ----------

  function showScope(i) {
    if (i === hoveredCell) return;
    for (const j of highlightedScope) poly[j].classList.remove("scope");
    highlightedScope = [];
    hoveredCell = i;
    if (i < 0 || !clues[i]) return;
    highlightedScope = clues[i].cells.slice();
    for (const j of highlightedScope) poly[j].classList.add("scope");
  }

  function firstValue(i, button) {
    if (button === 1) return 0;
    if (button === 2) return gameState.settings.speedMode ? 0 : (state[i] === 2 ? 0 : 2);
    if (tool === "erase") return 0;
    if (tool === "red" && !gameState.settings.speedMode) return state[i] === 2 ? 0 : 2;
    return state[i] === 1 ? 0 : 1;
  }

  // Green cells feed the crucible: one prima materia per cell.
  // Changing a fed cell back to empty refunds it.
  function setCell(i, value) {
    if (value === 1 && state[i] !== 1) {
      if (gameState.resources.prima_materia.amount < 1) {
        setStatus("Not enough prima materia to feed the crucible.", "err");
        return false;
      }
      gameState.resources.prima_materia.amount -= 1;
    } else if (state[i] === 1 && value !== 1) {
      gameState.resources.prima_materia.amount += 1;
    }
    state[i] = value;
    paintCell(i);
    updateFades();
    renderResources();
    return true;
  }

  function applyPaint(i, button) {
    if (gameState.currentPuzzle.solved) return;
    if (dragApply === null) dragApply = firstValue(i, button);
    if (!setCell(i, dragApply)) {
      dragApply = null;
      dragging = false;
    }
  }

  boardEl.addEventListener("mousedown", e => {
    const t = e.target.closest("polygon"); if (!t) return;
    e.preventDefault(); dragging = true; dragApply = null;
    applyPaint(+t.dataset.idx, e.button);
  });
  boardEl.addEventListener("mouseover", e => {
    const t = e.target.closest("polygon");
    if (!t) { showScope(-1); return; }
    const i = +t.dataset.idx;
    showScope(i);
    if (dragging) applyPaint(i, 0);
  });
  boardEl.addEventListener("mouseleave", () => showScope(-1));
  window.addEventListener("mouseup", () => { if (dragging) { dragging = false; afterMove(); } });
  boardEl.addEventListener("contextmenu", e => e.preventDefault());

  function setTool(t) {
    if (gameState.settings.speedMode && t === "red") t = "green";
    tool = t;
    document.getElementById("tGreen").classList.toggle("on", t === "green");
    document.getElementById("tRed").classList.toggle("on", t === "red");
    document.getElementById("tErase").classList.toggle("on", t === "erase");
    document.getElementById("tRed").disabled = gameState.settings.speedMode;
  }

  // ---------- Win / Progress ----------

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls ? `status-${cls}` : "";
  }

  function boardComplete() {
    for (let i = 0; i < cells.length; i++) {
      if (gameState.settings.speedMode) {
        if ((state[i] === 1 ? 1 : 0) !== solution[i]) return false;
      } else {
        const want = solution[i] === 1 ? 1 : 2;
        if (state[i] !== want) return false;
      }
    }
    return true;
  }

  function afterMove() { if (!gameState.currentPuzzle.solved && boardComplete()) reportWin(); }

  function reportWin() {
    if (gameState.currentPuzzle.solved) return;
    gameState.currentPuzzle.solved = true;

    // The pattern is complete: whatever prima was fed into the green cells
    // is released as the elements the current crucible knows how to make.
    const greens = solution.filter(v => v === 1).length;
    const per = transmuteYield(greens);
    const outputs = [];
    for (const id of ELEMENTS_BY_RADIUS[gameState.currentPuzzle.radius]) {
      addInventory(id, per);
      outputs.push(`${per} ${gameState.elements[id].sym} ${gameState.elements[id].name.toLowerCase()}`);
    }

    winSubEl.textContent = `${outputs.join("  ")}  ·  ${greens} prima fed`;
    setStatus(`Transmutation complete: +${outputs.join(" +")}`, "win");

    updateUI();
    saveProgress();
    celebrateWin();
  }

  function celebrateWin() {
    winBannerEl.classList.add("show");
    boardWrapEl.classList.add("success");
    scheduleNextPuzzle();
  }

  function scheduleNextPuzzle() {
    if (nextPuzzleTimer) clearTimeout(nextPuzzleTimer);
    nextPuzzleTimer = setTimeout(() => {
      nextPuzzleTimer = null;
      startPuzzle();
    }, 1600);
  }

  // ---------- Game Operations ----------

  function inventoryEntry(id) {
    return gameState.resources[id] || gameState.metals[id] || gameState.elements[id] || null;
  }

  function addInventory(id, amount) {
    const entry = inventoryEntry(id);
    if (entry) entry.amount += amount;
  }

  function canAfford(cost) {
    return Object.entries(cost).every(([id, amount]) => (inventoryEntry(id)?.amount || 0) >= amount);
  }

  function spend(cost) {
    for (const [id, amount] of Object.entries(cost)) inventoryEntry(id).amount -= amount;
  }

  function formatCost(cost) {
    return Object.entries(cost)
      .map(([id, amount]) => `${amount} ${id.replaceAll("_", " ")}`)
      .join(" · ");
  }

  // ---------- Passive Generators ----------

  // The alchemist's own hands always gather a little prima; the machines
  // below are amplifications of that labor. This base rate also removes
  // the level-0 soft-lock (a solve can spend your entire stash).
  const BASE_GATHER = 0.5;

  // Applies passive income. Called by the in-browser loop and driven
  // directly by the pacing harness.
  function tick(seconds) {
    addInventory("prima_materia", BASE_GATHER * seconds);
    for (const id of Object.keys(GENERATORS)) {
      const rate = generatorRate(id);
      if (rate > 0) addInventory(GENERATORS[id].produces, rate * seconds);
    }
  }

  function buyGenerator(id) {
    const gen = GENERATORS[id];
    if (!gen) return;
    if (gameState.upgrades.board_size.radius < gen.minRadius) {
      setStatus(`${gen.name} unlocks at crucible radius ${gen.minRadius}.`, "err");
      return;
    }
    const cost = generatorCost(id);
    if (gameState.resources.prima_materia.amount < cost) {
      setStatus("Not enough Prima Materia.", "err");
      return;
    }
    gameState.resources.prima_materia.amount -= cost;
    gameState.generators[id] = (gameState.generators[id] || 0) + 1;
    setStatus(`${gen.name} level ${gameState.generators[id]} — ${generatorRate(id).toFixed(2)}/s.`, "win");
    updateUI();
    saveProgress();
  }


  function startPuzzle() {
    if (nextPuzzleTimer) { clearTimeout(nextPuzzleTimer); nextPuzzleTimer = null; }
    winBannerEl.classList.remove("show");
    boardWrapEl.classList.remove("success");
    gameState.currentPuzzle.solved = false;
    const p = gameState.currentPuzzle;
    const insLevel = gameState.upgrades.inscription.level;
    const kinds = clueKinds(p.radius, insLevel);

    generate(p.radius, p.density, p.attempts, kinds, insLevel * INSCRIPTION.step);
    state = cells.map(() => 0);
    buildBoard();

    const greens = solution.filter(v => v === 1).length;
    const per = transmuteYield(greens);
    const syms = ELEMENTS_BY_RADIUS[p.radius].map(id => gameState.elements[id].sym).join(" ");
    recipeEl.textContent = `feeds ${greens} prima  →  ${per} × ${syms}`;

    setStatus("New puzzle forged.", "info");
    updateUI();
  }

  function upgradeBoard() {
    if (gameState.upgrades.board_size.radius >= MAX_RADIUS) {
      setStatus("The crucible has reached its final form.", "info");
      return;
    }
    const cost = gameState.upgrades.board_size.cost;
    if (gameState.resources.prima_materia.amount >= cost) {
      gameState.resources.prima_materia.amount -= cost;
      gameState.upgrades.board_size.radius += 1;
      gameState.upgrades.board_size.cost = Math.floor(cost * 1.6);
      gameState.currentPuzzle.radius = gameState.upgrades.board_size.radius;
      startPuzzle();
      saveProgress();
    } else {
      setStatus("Not enough Prima Materia.", "err");
    }
  }

  function inscriptionCost() {
    return Math.floor(INSCRIPTION.baseCost * Math.pow(INSCRIPTION.growth, gameState.upgrades.inscription.level));
  }

  function buyInscription() {
    const ins = gameState.upgrades.inscription;
    const p = gameState.currentPuzzle;
    const cost = inscriptionCost();
    if (gameState.resources.prima_materia.amount < cost) {
      setStatus("Not enough Prima Materia.", "err");
      return;
    }
    gameState.resources.prima_materia.amount -= cost;
    ins.level += 1;
    const want = Math.min(ins.level * INSCRIPTION.step, p.removedTotal || 0);
    for (let k = p.inscribed || 0; k < want; k++) {
      const rf = p.removedFull[k];
      clues[rf.idx] = rf.clue;
    }
    p.inscribed = want;
    buildBoard();
    let note = "";
    if (ins.level === INSCRIPTION_KINDS.flow) note = " Flow clues join future boards.";
    else if (ins.level === INSCRIPTION_KINDS.mirror) note = " Mirror clues join future boards.";
    setStatus(`Clues inscribed: ${p.inscribed} of ${p.removedTotal || 0} on this board.${note}`, "win");
    updateUI();
    saveProgress();
  }

  function buyTech(techId) {
    const tech = getTechById(techId);
    if (!tech) return;
    if (gameState.techTree[techId]) return;
    
    // Check requirement
    const reqs = tech.req;
    for(const r of reqs) if(!gameState.techTree[r]) {
      setStatus(`Requires ${getTechById(r).name}`, "err");
      return;
    }

    if (!canAfford(tech.cost)) {
      setStatus(`Requires ${formatCost(tech.cost)}.`, "err");
      return;
    }
    spend(tech.cost);
    gameState.techTree[techId] = true;
    setStatus(`${tech.name} achieved!`, "win");
    updateUI();
    saveProgress();
    if (techId === "philosophers_stone") celebrateMagnumOpus();
  }

  // The Great Work is done: a persistent gold overlay marks the completion
  // and offers to keep playing in endless mode.
  function celebrateMagnumOpus() {
    opusBannerEl.classList.add("show");
    boardWrapEl.classList.add("success");
  }

  function getTechById(id) {
    return TECHS.find(t => t.id === id);
  }

  // ---------- Transmutation Implementation ----------

  function transmute(type, id) {
    const recipe = type === 'metal' ? METAL_RECIPES[id] : ELEMENT_RECIPES[id];
    if (!recipe) return;

    if (!canAfford(recipe.cost)) {
      setStatus(`Requires ${formatCost(recipe.cost)}.`, "err");
      return;
    }
    spend(recipe.cost);

    if (type === 'metal') gameState.metals[id].amount++;
    else gameState.elements[id].amount++;

    setStatus(`Transmuted ${id}!`, "win");
    updateUI();
    saveProgress();
  }

  // ---------- UI Management ----------

  function updateUI() {
    renderResources();
    renderUpgrades();
    renderTechTree();
    renderTransmutation();
    updateLocationUI();
  }

  function checkAndSetLocation() {
    const insLevel = gameState.upgrades.inscription.level;
    for (const [id, loc] of Object.entries(LOCATIONS)) {
      if (gameState.upgrades.board_size.radius >= loc.minRadius && insLevel >= (loc.minInscription || 0)) gameState.currentLocationId = id;
    }
  }

  function updateLocationUI() {
    checkAndSetLocation();
    const loc = LOCATIONS[gameState.currentLocationId];
    const titleEl = document.getElementById("loc-title");
    const infoEl = document.getElementById("loc-info");

    titleEl.textContent = loc.name;
    infoEl.textContent = loc.desc;
    document.documentElement.style.setProperty("--bg", loc.bg);
    document.documentElement.style.setProperty("--accent", loc.accent);
    document.body.style.backgroundColor = loc.bg;
  }

  function renderResources() {
    resListEl.innerHTML = "";
    // Render basic resources
    for (const [id, data] of Object.entries(gameState.resources)) {
      if (data.amount > 0 || id === "prima_materia") {
        const div = document.createElement("div");
        div.className = "resource-item";
        const rate = incomeRate(id);
        div.innerHTML = `
          <span class="resource-name" style="color:${data.color || 'inherit'}">${data.name}</span>
          <span class="resource-val">${Math.floor(data.amount)}${rate > 0 ? `<span class="resource-rate">+${rate.toFixed(2)}/s</span>` : ""}</span>
        `;
        resListEl.appendChild(div);
      }
    }
    // Render metals
    const metalHeader = document.createElement("div");
    metalHeader.className = "panel-header";
    metalHeader.style.marginTop = "20px";
    metalHeader.style.padding = "5px 0";
    metalHeader.textContent = "Metals";
    resListEl.appendChild(metalHeader);
    for (const [id, data] of Object.entries(gameState.metals)) {
      if (data.amount > 0) {
        const div = document.createElement("div");
        div.className = "resource-item";
        div.innerHTML = `
          <span class="resource-name">${data.sym} ${data.name}</span>
          <span class="resource-val">${data.amount}</span>
        `;
        resListEl.appendChild(div);
      }
    }
    // Render elements
    const elemHeader = document.createElement("div");
    elemHeader.className = "panel-header";
    elemHeader.style.marginTop = "20px";
    elemHeader.style.padding = "5px 0";
    elemHeader.textContent = "Elements";
    resListEl.appendChild(elemHeader);
    for (const [id, data] of Object.entries(gameState.elements)) {
      if (data.amount > 0) {
        const div = document.createElement("div");
        div.className = "resource-item";
        const rate = incomeRate(id);
        div.innerHTML = `
          <span class="resource-name">${data.sym} ${data.name}</span>
          <span class="resource-val">${Math.floor(data.amount)}${rate > 0 ? `<span class="resource-rate">+${rate.toFixed(2)}/s</span>` : ""}</span>
        `;
        resListEl.appendChild(div);
      }
    }
  }

  function renderUpgrades() {
    upgradeListEl.innerHTML = "";
    const radius = gameState.upgrades.board_size.radius;
    const insLevel = gameState.upgrades.inscription.level;
    const atMaxRadius = radius >= MAX_RADIUS;

    // Board expansion (the crucible's two size increases).
    const boardCost = gameState.upgrades.board_size.cost;
    const bDiv = document.createElement("div");
    bDiv.className = "tech-item";
    bDiv.innerHTML = `
      <span class="tech-name">Expand Crucible</span>
      <span class="tech-desc">${atMaxRadius ? "The crucible has reached its final form." : `Increase radius to ${radius + 1}`}</span>
      ${atMaxRadius ? "" : `<span class="tech-cost">${boardCost} Prima Materia</span>`}
      ${atMaxRadius ? "" : `<button class="tech-btn primary" id="btn-upgrade-board" ${canAfford({ prima_materia: boardCost }) ? "" : "disabled"}>Upgrade</button>`}
    `;
    upgradeListEl.appendChild(bDiv);
    if (!atMaxRadius) document.getElementById("btn-upgrade-board").onclick = upgradeBoard;

    // Clue inscription (the long upgrade path: faster deductions).
    const p = gameState.currentPuzzle;
    const inscribedNow = p.inscribed || 0;
    const insCost = inscriptionCost();
    const nextKind = insLevel < INSCRIPTION_KINDS.flow
      ? `Flow clues join at level ${INSCRIPTION_KINDS.flow}`
      : insLevel < INSCRIPTION_KINDS.mirror
        ? `Mirror clues join at level ${INSCRIPTION_KINDS.mirror}`
        : "All clue forms etched";
    const iDiv = document.createElement("div");
    iDiv.className = "tech-item";
    iDiv.innerHTML = `
      <span class="tech-name">Inscribe Clues · Level ${insLevel}</span>
      <span class="tech-desc">Re-etch ${INSCRIPTION.step} stripped clues onto the board (this one and all future ones) — a faster deduction. ${inscribedNow}/${p.removedTotal || 0} etched here. ${nextKind}.</span>
      <span class="tech-cost">${insCost} Prima Materia</span>
      <button class="tech-btn primary" id="btn-inscribe" ${canAfford({ prima_materia: insCost }) ? "" : "disabled"}>Inscribe</button>
    `;
    upgradeListEl.appendChild(iDiv);
    document.getElementById("btn-inscribe").onclick = buyInscription;

    // Generators (the passive income options, all visible at once).
    const gHeader = document.createElement("div");
    gHeader.className = "panel-header";
    gHeader.style.marginTop = "10px";
    gHeader.style.padding = "5px 0";
    gHeader.textContent = "Generators";
    upgradeListEl.appendChild(gHeader);
    for (const [id, gen] of Object.entries(GENERATORS)) {
      const level = gameState.generators[id] || 0;
      const locked = radius < gen.minRadius;
      const div = document.createElement("div");
      div.className = "tech-item" + (locked ? " locked" : "");
      const rate = generatorRate(id);
      const cost = generatorCost(id);
      div.innerHTML = `
        <span class="tech-name">${gen.name}${level > 0 ? ` · Lv ${level}` : ""}</span>
        <span class="tech-desc">${locked ? `Unlocks at crucible radius ${gen.minRadius}.` : `Produces ${rate.toFixed(2)} ${gen.produces.replaceAll("_", " ")}/s`}</span>
        ${locked ? "" : `<span class="tech-cost">${cost} Prima Materia</span>`}
        ${locked ? "" : `<button class="tech-btn primary" id="btn-gen-${id}" ${canAfford({ prima_materia: cost }) ? "" : "disabled"}>${level > 0 ? "Expand" : "Build"}</button>`}
      `;
      upgradeListEl.appendChild(div);
      if (!locked) document.getElementById(`btn-gen-${id}`).onclick = () => buyGenerator(id);
    }

    const kinds = clueKinds(radius, insLevel);
    const nextLocation = Object.values(LOCATIONS).find(l => !(radius >= l.minRadius && insLevel >= (l.minInscription || 0)));
    const progress = document.createElement("div");
    progress.className = "tech-item unlocked";
    progress.innerHTML = `
      <span class="tech-name">Crucible radius ${radius} · Inscription ${insLevel}</span>
      <span class="tech-desc">Clues: ${kinds.join(", ")}</span>
      <span class="tech-desc">${nextLocation ? `Next location: ${nextLocation.name} (${radius < nextLocation.minRadius ? `radius ${nextLocation.minRadius}` : `inscription ${nextLocation.minInscription}`})` : "All locations unlocked"}</span>
    `;
    upgradeListEl.appendChild(progress);
  }

  function renderTechTree() {
    techListEl.innerHTML = "";
    TECHS.forEach(t => {
      const isUnlocked = gameState.techTree[t.id];
      const isAvailable = t.req.every(r => gameState.techTree[r]);
      
      const div = document.createElement("div");
      div.className = "tech-item" + (isUnlocked ? " unlocked" : (isAvailable ? "" : " locked"));
      
      const costStr = formatCost(t.cost);

      div.innerHTML = `
        <span class="tech-name">${t.name} ${isUnlocked ? "✓" : ""}</span>
        <span class="tech-desc">${t.desc}</span>
        ${!isUnlocked ? `<span class="tech-cost">${costStr}</span>` : ""}
        ${!isUnlocked && isAvailable ? `<button class="tech-btn primary" id="btn-tech-${t.id}">Perform</button>` : ""}
      `;
      techListEl.appendChild(div);
      
      if (!isUnlocked && isAvailable) {
        document.getElementById(`btn-tech-${t.id}`).onclick = () => buyTech(t.id);
      }
    });
  }

  function renderTransmutation() {
    transmuteListEl.innerHTML = "";
    
    // Metals
    const mHeader = document.createElement("div");
    mHeader.className = "panel-header";
    mHeader.style.marginTop = "10px";
    mHeader.style.padding = "5px 0";
    mHeader.textContent = "Transmute Metals";
    transmuteListEl.appendChild(mHeader);

    for (const [id, data] of Object.entries(gameState.metals)) {
      const recipe = METAL_RECIPES[id];
      const div = document.createElement("div");
      div.className = "tech-item";
      const costStr = formatCost(recipe.cost);
      div.innerHTML = `
        <span class="tech-name">${data.sym} ${data.name}</span>
        <span class="tech-cost">${costStr}</span>
        <button class="transmute-btn" id="transmute-m-${id}" ${canAfford(recipe.cost) ? "" : "disabled"}>Transmute</button>
      `;
      transmuteListEl.appendChild(div);
      document.getElementById(`transmute-m-${id}`).onclick = () => transmute('metal', id);
    }

    // Quintessence: the classical elements are the crucible's own output;
    // only the fifth essence is still distilled by hand here.
    const qHeader = document.createElement("div");
    qHeader.className = "panel-header";
    qHeader.style.marginTop = "10px";
    qHeader.style.padding = "5px 0";
    qHeader.textContent = "Distill Quintessence";
    transmuteListEl.appendChild(qHeader);

    {
      const id = "quintessence";
      const data = gameState.elements[id];
      const recipe = ELEMENT_RECIPES[id];
      const div = document.createElement("div");
      div.className = "tech-item";
      const costStr = formatCost(recipe.cost);
      div.innerHTML = `
        <span class="tech-name">${data.sym} ${data.name}</span>
        <span class="tech-desc">Unite earth, water, air and fire.</span>
        <span class="tech-cost">${costStr}</span>
        <button class="transmute-btn" id="transmute-e-${id}" ${canAfford(recipe.cost) ? "" : "disabled"}>Distill</button>
      `;
      transmuteListEl.appendChild(div);
      document.getElementById(`transmute-e-${id}`).onclick = () => transmute('element', id);
    }
  }

  // ---------- Persistence ----------

  const SAVE_KEY = "greatwork_v4";

  function saveProgress() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(gameState)); } catch(e) {}
  }

  function mergeInventoryMap(defaultMap, savedMap = {}, legacyMap = {}) {
    const merged = {};
    for (const [id, defaultEntry] of Object.entries(defaultMap)) {
      const saved = savedMap?.[id] ?? legacyMap?.[id];
      const savedAmount = typeof saved === "number" ? saved : Number(saved?.amount);
      merged[id] = {
        ...defaultEntry,
        ...(saved && typeof saved === "object" ? saved : {}),
        amount: Number.isFinite(savedAmount) ? Math.max(0, savedAmount) : defaultEntry.amount
      };
    }
    return merged;
  }

  function loadProgress() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (!d || typeof d !== "object") return;

      const defaults = gameState;
      const savedRadius = Number(d.upgrades?.board_size?.radius ?? d.currentPuzzle?.radius);
      const radius = Number.isFinite(savedRadius)
        ? Math.min(MAX_RADIUS, Math.max(3, Math.floor(savedRadius)))
        : defaults.upgrades.board_size.radius;
      const savedCost = Number(d.upgrades?.board_size?.cost);
      const insLevel = Math.max(0, Math.floor(Number(d.upgrades?.inscription?.level) || 0));
      const techTree = Object.fromEntries(TECHS.map(tech => [tech.id, Boolean(d.techTree?.[tech.id])]));
      if (d.techTree?.magnum_opus) techTree.philosophers_stone = true;

      gameState = {
        ...defaults,
        resources: mergeInventoryMap(defaults.resources, d.resources),
        metals: mergeInventoryMap(defaults.metals, d.metals),
        elements: mergeInventoryMap(defaults.elements, d.elements, d.resources),
        generators: { ...defaults.generators, ...(d.generators || {}) },
        upgrades: {
          board_size: {
            radius,
            cost: Number.isFinite(savedCost) && savedCost > 0 ? savedCost : defaults.upgrades.board_size.cost
          },
          inscription: { level: insLevel }
        },
        techTree,
        settings: { ...defaults.settings, ...(d.settings || {}) },
        currentPuzzle: { radius, density: 0.4, attempts: 5, solved: false },
        currentLocationId: d.currentLocationId || defaults.currentLocationId
      };
    } catch(e) { console.error(e); }
  }

  // ---------- Initialization ----------

  document.getElementById("new-board").onclick = startPuzzle;
  document.getElementById("check-board").onclick = () => {
    if(boardComplete()) { if(!gameState.currentPuzzle.solved) reportWin(); return; }
    let bad=0;
    for(let i=0;i<cells.length;i++){
      poly[i].classList.remove("bad");
      if(state[i]===1 && solution[i]===0){ poly[i].classList.add("bad"); bad++; }
    }
    setStatus(bad? `${bad} mistakes detected.` : "No mistakes so far.", bad?"err":"info");
  };
  document.getElementById("reset-board").onclick = () => {
    if(gameState.currentPuzzle.solved) return;
    const fed = state.filter(v => v === 1).length;
    state = cells.map(()=>0);
    if (fed > 0) gameState.resources.prima_materia.amount += fed;
    renderCell(); renderResources(); setStatus("Board cleared.", "info");
  };
  document.getElementById("solve-board").onclick = () => {
    for(let i=0;i<cells.length;i++) state[i]= solution[i]===1 ? 1 : (gameState.settings.speedMode ? 0 : 2);
    gameState.currentPuzzle.solved = true; renderCell();
    setStatus("Solution revealed.", "info");
  };
  document.getElementById("opus-continue").onclick = () => {
    opusBannerEl.classList.remove("show");
    boardWrapEl.classList.remove("success");
    setStatus("The work endures. Transmute on.", "info");
  };
  document.getElementById("speed-mode").onchange = (e) => {
    gameState.settings.speedMode = e.target.checked;
    if(gameState.settings.speedMode){ 
      for(let i=0;i<cells.length;i++) if(state[i]===2) state[i]=0; 
      setTool("green"); 
    }
    renderCell();
    setStatus(gameState.settings.speedMode ? "Fast Mode: leftovers auto-fill red." : "Manual Mode: mark reds yourself.", "info");
    setTool(tool);
    saveProgress();
  };

  document.getElementById("tGreen").onclick = ()=> setTool("green");
  document.getElementById("tRed").onclick   = ()=> setTool("red");
  document.getElementById("tErase").onclick = ()=> setTool("erase");

  loadProgress();
  document.getElementById("speed-mode").checked = gameState.settings.speedMode;
  setTool("green");
  startPuzzle();
  setInterval(() => { tick(1); updateUI(); }, 1000);

 </script>
</body>
</html>
